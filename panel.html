<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem | Yayıncı Kontrol Paneli</title><style>*{box-sizing:border-box}body{margin:0;background:#101521;color:#f5f7ff;font:15px system-ui;padding:22px}main{max-width:800px;margin:auto}h1{margin:0;font-size:27px}p{color:#a8b5cc}a{color:#9dc7ff}.box{background:#1a2435;border:1px solid #33435b;border-radius:16px;padding:20px;margin-top:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,button{font:inherit;border-radius:10px;padding:13px}input{width:100%;border:1px solid #64748b;background:#0e1726;color:white;margin:10px 0}button{border:1px solid #64748b;background:#26364e;color:#fff;cursor:pointer}button.active{border-color:#e8bd7b;background:#63402e}button.primary{background:#b33d55;border:0;font-weight:800;width:100%;margin-top:12px}button:hover{filter:brightness(1.17)}.row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.row button{flex:1}small{color:#a8b5cc}#log{padding-left:20px}#log li{padding:5px 0;border-bottom:1px solid #33435b}#connection{font-weight:700;color:#b5d4a1}</style></head><body><main><h1>👑 Hürrem — Yayıncı Paneli</h1><p>Bu sayfa yalnızca senin yönetimin için. İzleyicilere <a href="./?view=live" target="_blank">temiz yayın ekranını</a> göster.</p><div class="box"><strong>Katılımcı ekle / karakter değiştir</strong><input id="username" autocomplete="off" placeholder="TikTok kullanıcı adı (örn. ahmet123)" autofocus><div class="grid" id="roles"><button data-role="female" class="active">🌹 Kadın</button><button data-role="male">🧔 Erkek</button><button data-role="mehter">🥁 Mehteran</button><button data-role="hurrem">👑 Hürrem · 60 sn</button><button data-role="kanuni">👑 Kanuni · 60 sn</button></div><button id="add" class="primary">➕ ALAYA EKLE (ENTER)</button><p id="result">Kullanıcı adını yaz, karakteri seç, Enter'a bas.</p></div><div class="box"><strong>Yayın kontrolleri</strong><div class="row"><button id="start">⏱ 30 saniyeyi başlat</button><button id="march">🚶 Yürüyüşü başlat</button><button id="reset">📷 Kamerayı sıfırla</button></div><div class="row"><button data-track="0">🎵 Bekleme müziği</button><button data-track="1">🎵 Yürüyüş müziği</button><button data-track="2">🎵 Tören müziği</button><button id="mute">🔇 Müziği durdur</button></div><p><small id="connection">Bağlantı kontrol ediliyor…</small></p></div><div class="box"><strong>Son işlemler</strong><ol id="log"></ol><button id="clear">Listeyi temizle</button></div></main><script>
const $=id=>document.getElementById(id);let role='female';const channel=new BroadcastChannel('hurrem-control-v1');
const local=['localhost','127.0.0.1'].includes(location.hostname);
$('connection').textContent=local?'Yerel köprü modu: komutlar yayın ekranına aktarılır.':'Aynı tarayıcıdaki yayın sekmesiyle bağlantı modu.';
function send(command){
 channel.postMessage(command);
 if(local)fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)}).catch(e=>{$('connection').textContent='Yerel köprü hatası: '+e.message});
}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));$('username').focus()});
function add(){const username=$('username').value.trim().replace(/^@/,'').slice(0,24);if(!username)return $('username').focus();send({type:'join',username,role});const li=document.createElement('li');li.textContent='@'+username+' — '+({female:'Kadın',male:'Erkek',mehter:'Mehteran',hurrem:'Hürrem (60 sn)',kanuni:'Kanuni (60 sn)'})[role];$('log').prepend(li);$('result').textContent='Gönderildi: @'+username+' — '+role;$('username').value='';$('username').focus();}
$('add').onclick=add;$('username').onkeydown=e=>{if(e.key==='Enter')add()};
$('start').onclick=()=>send({type:'start'});$('march').onclick=()=>send({type:'march'});$('reset').onclick=()=>send({type:'cameraReset'});
document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>send({type:'music',track:Number(b.dataset.track)}));
$('mute').onclick=()=>send({type:'stopMusic'});$('clear').onclick=()=>{$('log').replaceChildren()};
</script></body></html>
