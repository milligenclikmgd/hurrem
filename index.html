<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem ve Kanuni | Saray Düğünü 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#16131b;color:#f8eedb;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));aspect-ratio:9/16;position:relative;overflow:hidden;background:#b9c8d4}#scene{width:100%;height:100%}.top{position:absolute;top:3%;width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 8px #0009}.top small{letter-spacing:2px;font-size:10px}.top h1{font:700 26px Georgia,serif;margin:8px 0}.status{position:absolute;bottom:16px;left:14px;right:14px;background:#241a21cc;border:1px solid #ffffff33;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}.status b{color:#f5c56d}.status button{background:#a3414b;color:white;border:0;padding:7px 12px;border-radius:7px;cursor:pointer;margin-top:5px}.top{top:5%;}.top h1{font-size:clamp(19px,5vw,27px)}.status{bottom:8px;left:10px;right:auto;max-width:75%;padding:5px 8px;font-size:10px;opacity:.75}.status.ready{display:none}.live-label{position:absolute;top:2%;left:12px;font-size:10px;letter-spacing:1px;color:#fff9df;background:#5c3447a6;padding:6px 10px;border-radius:16px;pointer-events:none}.live-hint{position:absolute;bottom:3%;right:12px;color:#fff;font-size:10px;text-shadow:0 1px 4px #000a;pointer-events:none} .game-ui{position:absolute;left:10px;right:10px;bottom:12px;z-index:5;background:#211a25d9;border:1px solid #e9d1a355;border-radius:13px;padding:9px;color:#fff;font-size:11px;backdrop-filter:blur(9px)}.game-head{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:6px}.game-head strong{font-size:13px;color:#ffe3a2}.game-ui input,.game-ui select{background:#fff;color:#241a21;border:0;border-radius:6px;padding:7px;min-width:0}.game-ui button{background:#a53b48;color:white;border:1px solid #ffffff44;border-radius:7px;padding:7px;cursor:pointer}.game-ui button:disabled{opacity:.45}.game-row{display:flex;gap:5px;margin-top:6px}.game-row input{flex:1;width:70px}.game-row select{flex:1}.game-row button{white-space:nowrap}.game-progress{height:5px;background:#ffffff33;border-radius:8px;overflow:hidden}.game-progress span{display:block;height:100%;width:100%;background:#e9bd73}.game-note{margin-top:6px;color:#f3ddbb;font-size:10px}.live-hint{bottom:auto;top:9%}.status{bottom:170px}</style></head><body><main class="phone"><div id="scene"></div><div class="top"><small>KANUNİ & HÜRREM · DÜĞÜN ALAYI</small><h1>Kanuni &amp; Hürrem</h1></div><div class="live-label">✦ SARAY DÜĞÜNÜ</div><div class="live-hint">Fareyle kamerayı hareket ettir</div><section class="game-ui" aria-label="Düğün alayı kontrol paneli"><div class="game-head"><strong id="phase">Alay hazırlanıyor</strong><span id="timer">00:30</span><span id="count">0/90 kişi</span></div><div class="game-progress"><span id="progress"></span></div><div class="game-row"><input id="guestName" maxlength="22" placeholder="Katılımcı adı"><button id="join">Alaya katıl</button><button id="start">30 sn başlat</button></div><div class="game-row"><select id="track" aria-label="Müzik seçimi"><option value="0">1 · Alay toplanıyor</option><option value="1">2 · Düğün yürüyüşü</option><option value="2">3 · Düğün merasimi</option></select><button id="music">▶ Müzik aç</button><button id="gift">🎁 Hediye testi</button></div><div class="game-note" id="gameNote">Test modu · TikTok LIVE bağlantısı henüz yok</div></section><div class="status" id="status">3D modeller yükleniyor…</div></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const host=document.querySelector('#scene'),status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#b9c8d4');const camera=new THREE.PerspectiveCamera(43,9/16,.1,300);camera.position.set(0,6.4,17.5);camera.lookAt(0,0,-2.8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,-2.8);controls.enableDamping=true;controls.dampingFactor=.09;controls.minDistance=.6;controls.maxDistance=110;controls.maxPolarAngle=Math.PI*.98;controls.update();scene.add(new THREE.HemisphereLight('#fff6e9','#938778',1.45));const sun=new THREE.DirectionalLight('#fff3df',1.85);sun.position.set(-8,18,9);sun.castShadow=true;scene.add(sun);
const loader=new GLTFLoader();const models=[['Meydan','osmanli_dugun_meydani_v3.glb',null],['Kanuni','orta_detay_padisah_karakter_v2.glb',[-.27,0,4.1]],['Hürrem','orta_detay_sultan_karakter.glb',[.27,0,4.1]],['Erkek davetli','orta_detay_osmanli_adam_karakter_v2.glb',[-.85,0,5.6]],['Kadın davetli','orta_detay_osmanli_kadin_karakter.glb',[.85,0,5.6]],['Mehteran','mehter_karakter_revize.glb',[-1.05,0,7]]];let loaded=0,failed=[];const people=[];let courtyard=null;
async function addModel([label,file,pos]){try{const gltf=await loader.loadAsync('./'+file);const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=pos?((label==='Kanuni'||label==='Hürrem')?0.53:0.47)/Math.max(size.y,.001):0.32;root.scale.setScalar(scale);root.position.set((pos?.[0]||0)-center.x*scale,pos?(pos[1]||0)-bounds.min.y*scale:0,(pos?.[2]||0)-center.z*scale);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});if(pos){root.userData.name=label;root.rotation.y=Math.PI;root.position.y=0;root.userData.standY=0;root.userData.standPosition=root.position.clone();people.push(root)}else {courtyard=root;root.traverse(o=>{if(o.name&&/Wedding_Floral_Arch/i.test(o.name))o.visible=false;if(o.isMesh&&/Wedding_(?:Walkway_Carpet|Carpet_Runner_Long)/i.test(o.name)){const mats=Array.isArray(o.material)?o.material:[o.material];o.material=mats.map(m=>{const c=m.clone();if(c.color)c.color.set('#a83d49');return c});if(o.material.length===1)o.material=o.material[0];}});}loaded++;}catch(e){failed.push(label);console.error(label,e)}status.classList.toggle('ready',loaded===6&&failed.length===0);status.innerHTML='<b>'+loaded+'/6 model yüklendi</b>'+ (failed.length?'<div>Eksik dosyalar: '+failed.join(', ')+'</div>':'<div>Yeni V3 düğün meydanı yüklendi.</div>')+(failed.length?'<div>GLB dosyalarını GitHub deposunun ana dizinine yükleyin.</div>':'');}
await Promise.all(models.map(addModel));
if(courtyard){courtyard.updateMatrixWorld(true);
 // V3 meydanı kendi özgün geometrisiyle kullanılır; kodla uzatma yapılmaz.
 const meshes=[];courtyard.traverse(o=>{if(o.isMesh&&!/Sky|Cloud|Dome|Roof|Wall|Canopy/i.test(o.name))meshes.push(o)});const ray=new THREE.Raycaster();for(const p of people){ray.set(new THREE.Vector3(p.position.x,4,p.position.z),new THREE.Vector3(0,-1,0));const hits=ray.intersectObjects(meshes,false);const floor=hits.find(h=>h.point.y>=-.15&&h.point.y<=.6&&h.face&&h.face.normal.y>.45);if(floor)p.position.y=floor.point.y;}}

// TikTok LIVE bağlayıcısına hazır alay sistemi. Ses dosyaları ayrıca lisanslı olarak yüklenmelidir.
const $=id=>document.getElementById(id),MAX_GUESTS=90,roster=new Map();
const templates={male:people.find(p=>p.userData.name==='Erkek davetli'),female:people.find(p=>p.userData.name==='Kadın davetli'),mehter:people.find(p=>p.userData.name==='Mehteran')};
const royal=people.filter(p=>['Kanuni','Hürrem'].includes(p.userData.name));
const procession=[...royal],entryZ=15.1,stageZ=-3.35,walkSpeed=.24;
const roles=['male','female','mehter'],roleNames={male:'Erkek davetli',female:'Kadın davetli',mehter:'Mehteran'};
let phase='countdown',startedAt=performance.now(),marchStart=0,walkDistance=0,previousFrame=performance.now(),trackIndex=0;
const audioPlayer=new Audio();audioPlayer.loop=true;audioPlayer.volume=.55;
const tracks=['ilk30saniye.mp3','yurume1.mp3','yurume2.mp3'];
let musicOn=false;
function showNote(msg){$('gameNote').textContent=msg}
function switchTrack(index){
 trackIndex=((index%tracks.length)+tracks.length)%tracks.length;$('track').value=String(trackIndex);
 audioPlayer.src='./'+tracks[trackIndex];
 if(musicOn)audioPlayer.play().catch(()=>showNote('Lisanslı MP3 dosyası music/ klasörüne yüklenmeli'));
 showNote('Çalınan müzik: '+$('track').selectedOptions[0].text);
}
function cloneRole(role,name){
 const base=templates[role];if(!base)return null;
 const obj=base.clone(true);obj.traverse(o=>{if(o.isMesh){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone()}});
 obj.userData.name=name;obj.userData.role=role;obj.rotation.y=Math.PI;
 scene.add(obj);return obj;
}
function slot(index){const row=Math.floor(index/2),side=index%2===0?-1:1;return {x:side*(.64+(row%3)*.13),z:entryZ+row*.49}}
function joinGuest(name,role='male'){
 const username=String(name||'').trim().slice(0,22);if(!username)return false;
 if(roster.has(username))return changeRole(username,role);
 if(roster.size>=MAX_GUESTS){showNote('90 kişilik alay doldu');return false}
 if(phase==='finished'){showNote('Tören başladı; katılım kapandı');return false}
 if(!roles.includes(role))role='male';
 const index=roster.size,point=slot(index),obj=cloneRole(role,username);if(!obj)return false;
 obj.position.set(point.x,0,point.z-walkDistance);obj.userData.slot=index;
 roster.set(username,obj);procession.push(obj);
 $('count').textContent=roster.size+'/90 kişi';showNote(username+' alaya katıldı · '+roleNames[role]);return true;
}
function changeRole(username,role){
 const old=roster.get(username);if(!old||!roles.includes(role))return false;
 if(old.userData.role===role)return true;
 const replacement=cloneRole(role,username);if(!replacement)return false;
 replacement.position.copy(old.position);replacement.rotation.copy(old.rotation);replacement.userData.slot=old.userData.slot;
 const index=procession.indexOf(old);if(index>=0)procession[index]=replacement;
 roster.set(username,replacement);scene.remove(old);showNote(username+' artık '+roleNames[role]);return true;
}
function receiveGift(name,gift='music'){
 // Hediye haritası LIVE sağlayıcısının gerçek hediye ID'leriyle sonradan bağlanabilir.
 const action=String(gift).toLowerCase();
 if(['male','female','mehter'].includes(action))return joinGuest(name,action);
 switchTrack(trackIndex+1);showNote('🎁 '+String(name||'İzleyici')+' · müzik değişti');return true;
}
function beginMarch(){
 if(phase==='march'||phase==='finished')return;
 phase='march';marchStart=performance.now();$('phase').textContent='Alay yavaşça yürüyor';
 $('timer').textContent='YÜRÜYÜŞ';$('start').disabled=true;
 switchTrack(1);showNote('Yürüyüş başladı · Yürürken katılım ve karakter değiştirme açık');
}
function seatEveryone(){
 phase='finished';$('phase').textContent='Düğün merasimi';$('timer').textContent='TÖREN';
 // V3 modelinin gerçek GLB koordinatları: iki taht x=±1.15,z=-10.65,
 // 36 sandalye x=±3.3/4.45/5.6 ve z=-7.8..-2.05,
 // mehter sahnesi x=-10.8,z=-3.5. Meydan ölçeği 0.32.
 const scale=.32;
 royal.forEach((p,i)=>{
   p.position.set((i===0?-1.15:1.15)*scale,.46*scale+.16,-10.65*scale);
   p.rotation.y=0;p.scale.y*=.73;
 });
 const guests=[...roster.values()].filter(p=>p.userData.role!=='mehter');
 const band=[...roster.values()].filter(p=>p.userData.role==='mehter');
 const chairX=[-3.3,-4.45,-5.6,3.3,4.45,5.6];
 guests.forEach((p,i)=>{
   const chairRow=Math.floor(i/6),x=chairX[i%6]*scale;
   if(chairRow<6){
     p.position.set(x,.54*scale+.12,(-7.8+chairRow*1.15)*scale);
     p.scale.y*=.75;p.rotation.y=0;
   }else{
     const overflow=i-36,side=overflow%2===0?-1:1;
     p.position.set(side*(2.15+Math.floor(overflow/12)*.5),0,-2+Math.floor(overflow/2)%6*.4);
     p.rotation.y=0;
   }
 });
 band.forEach((p,i)=>{p.position.set((-10.8+(i%5-2)*1.1)*scale,.43*scale,(-3.5+Math.floor(i/5)*1.05)*scale);p.rotation.y=0});
 switchTrack(2);
 showNote('Tören başladı · 36 sandalye dolana kadar oturma düzeni; mehter sahnede');
}
window.weddingLive={join:joinGuest,gift:receiveGift,changeRole,start:beginMarch};
$('join').onclick=()=>{if(joinGuest($('guestName').value,roles[roster.size%3]))$('guestName').value=''};
$('guestName').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});
$('start').textContent='Yürüyüşü başlat';$('start').onclick=beginMarch;
$('gift').onclick=()=>{const name=$('guestName').value.trim();if(name&&roster.has(name)){const role=roles[(roles.indexOf(roster.get(name).userData.role)+1)%3];receiveGift(name,role)}else receiveGift('Test hediyesi','music')};
$('track').onchange=e=>switchTrack(Number(e.target.value));
$('music').onclick=async()=>{musicOn=!musicOn;if(musicOn){if(!audioPlayer.getAttribute('src'))switchTrack(trackIndex);try{await audioPlayer.play()}catch(e){showNote('Ses için tarayıcı izni veya dosya erişimi gerekli');musicOn=false}}else audioPlayer.pause();$('music').textContent=musicOn?'❚❚ Müziği durdur':'▶ Müzik aç'};
$('gameNote').textContent='30 saniye katılım · Yürürken de katılabilirsiniz · Gerçek MP3 bekleniyor';
royal.forEach((p,i)=>{p.position.set(i===0?-.3:.3,0,entryZ-1);p.rotation.y=Math.PI});
switchTrack(0);const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const now=performance.now(),dt=Math.min(.05,(now-previousFrame)/1000);previousFrame=now;
 const t=clock.getElapsedTime();
 if(phase==='countdown'){
  const remaining=Math.max(0,30-Math.floor((now-startedAt)/1000));
  $('timer').textContent='00:'+String(remaining).padStart(2,'0');
  $('progress').style.width=(remaining/30*100)+'%';
  if(!remaining)beginMarch();
 }
 if(phase==='march'){
  const delta=walkSpeed*dt;walkDistance+=delta;
  for(const p of procession){p.position.z-=delta;p.rotation.y=Math.PI;p.position.y=Math.sin(t*5+p.position.z)*.008}
  if(royal[0]&&royal[0].position.z<=stageZ+1.5)seatEveryone();
 }
 controls.update();renderer.render(scene,camera);
}
animate();addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
</script></body></html>
