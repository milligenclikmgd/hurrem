<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem ve Kanuni | Saray Düğünü 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#16131b;color:#f8eedb;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,440px);height:min(100dvh,790px);aspect-ratio:9/16;position:relative;overflow:hidden;background:#b9c8d4}#scene{width:100%;height:100%}.top{position:absolute;top:3%;width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 8px #0009}.top small{letter-spacing:2px;font-size:10px}.top h1{font:700 26px Georgia,serif;margin:8px 0}.status{position:absolute;bottom:16px;left:14px;right:14px;background:#241a21cc;border:1px solid #ffffff33;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}.status b{color:#f5c56d}.status button{background:#a3414b;color:white;border:0;padding:7px 12px;border-radius:7px;cursor:pointer;margin-top:5px}</style></head><body><main class="phone"><div id="scene"></div><div class="top"><small>3D SARAY DÜĞÜNÜ · İLK DENEME</small><h1>Kanuni &amp; Hürrem</h1></div><div class="status" id="status">3D modeller yükleniyor…</div></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const host=document.querySelector('#scene'),status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#b9c8d4');const camera=new THREE.PerspectiveCamera(43,9/16,.1,300);camera.position.set(0,1.72,4.32);camera.lookAt(0,.9,-1.45);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight('#fff4e5','#776c66',2.2));const sun=new THREE.DirectionalLight('#ffffff',2.6);sun.position.set(-8,18,9);sun.castShadow=true;scene.add(sun);
const loader=new GLTFLoader();const models=[['Meydan','osmanli_dugun_meydani_v2.glb',null],['Kanuni','orta_detay_padisah_karakter_v2.glb',[-.55,0,2.25]],['Hürrem','orta_detay_sultan_karakter.glb',[.55,0,2.25]],['Erkek davetli','orta_detay_osmanli_adam_karakter_v2.glb',[-.95,0,3.18]],['Kadın davetli','orta_detay_osmanli_kadin_karakter.glb',[.95,0,3.18]],['Mehteran','mehter_karakter_revize.glb',[-1.55,0,3.65]]];let loaded=0,failed=[];const people=[];let courtyard=null;
async function addModel([label,file,pos]){try{const gltf=await loader.loadAsync('./'+file);const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=pos?.82/Math.max(size.y,.001):23/Math.max(size.x,size.z,.001);root.scale.setScalar(scale);root.position.set((pos?.[0]||0)-center.x*scale,(pos?.[1]||0)-bounds.min.y*scale,(pos?.[2]||0)-center.z*scale);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});if(pos){root.userData.name=label;root.rotation.y=Math.PI;people.push(root)}else courtyard=root;loaded++;}catch(e){failed.push(label);console.error(label,e)}status.innerHTML='<b>'+loaded+'/6 model yüklendi</b>'+ (failed.length?'<div>Eksik dosyalar: '+failed.join(', ')+'</div>':'<div>Kamera avlunun içinde; alay sahneye doğru bakıyor.</div>')+(failed.length?'<div>GLB dosyalarını GitHub deposunun ana dizinine yükleyin.</div>':'');}
await Promise.all(models.map(addModel));
if(courtyard){courtyard.updateMatrixWorld(true);const meshes=[];courtyard.traverse(o=>{if(o.isMesh)meshes.push(o)});const ray=new THREE.Raycaster();for(const p of people){ray.set(new THREE.Vector3(p.position.x,15,p.position.z),new THREE.Vector3(0,-1,0));const hits=ray.intersectObjects(meshes,false);const floor=hits.find(h=>h.point.y>=-.2&&h.point.y<=3.5&&h.face&&h.face.normal.y>.45);if(floor)p.position.y=floor.point.y;}}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();for(let i=0;i<people.length;i++){people[i].rotation.y=Math.PI+Math.sin(t*.4+i)*.04;people[i].position.y+=Math.sin(t*2+i)*.0006}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
</script></body></html>
