<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zikir Halkası | TikTok LIVE 2D</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#091b1a;color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100%;display:grid;place-items:center}.frame{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.777vw);aspect-ratio:9/16;overflow:hidden;background:#183c37;box-shadow:0 0 60px #0009}canvas{width:100%;height:100%;display:block}.header{position:absolute;top:3%;left:5%;right:5%;text-align:center;pointer-events:none;text-shadow:0 3px 8px #000}.header h1{font:700 clamp(20px,5vw,32px) Georgia,serif;color:#ffe4a2;margin:0}.header p{font-size:11px;letter-spacing:2px;margin:5px}.stats{position:absolute;top:11%;left:5%;right:5%;display:flex;justify-content:space-between;pointer-events:none}.stats span{background:#092823dc;border:1px solid #d2ae66a0;padding:7px 12px;border-radius:20px;font-size:12px}.controls{position:absolute;bottom:2%;left:4%;right:4%;padding:10px;background:#092923e8;border:1px solid #d7b876a8;border-radius:14px;display:flex;flex-direction:column;gap:7px}.controls input{width:100%;min-width:0;background:#e9f2eb;color:#102b24;border:0;border-radius:7px;padding:10px;font-size:13px}.buttons{display:flex;gap:5px}.buttons button{flex:1;border:1px solid #e2c68c70;background:#226a54;color:white;border-radius:7px;padding:9px 3px;cursor:pointer;font-weight:700;font-size:11px}.buttons button.secondary{background:#3d4639}.hint{text-align:center;color:#e7d9b4;font-size:10px}.toast{position:absolute;top:18%;left:8%;right:8%;text-align:center;font-weight:800;color:#fff1c1;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:1}body.live .controls{display:none}body.live .header{top:5%}</style></head>
<body><main class="frame"><canvas id="game" width="540" height="960" aria-label="Zikir halkası animasyonu"></canvas><div class="header"><h1>✦ ZİKİR HALKASI ✦</h1><p>ÖNCE AHLAK VE MANEVİYAT</p></div><div class="stats"><span id="count">Katılımcı: 0</span><span id="ring">Halka: 1 / 5</span></div><div id="toast" class="toast"></div><section class="controls"><input id="username" maxlength="24" placeholder="Katılımcı kullanıcı adı"><div class="buttons"><button id="join">+ Katılımcı</button><button id="add10">+ 10 kişi</button><button id="ringBtn">+ Halka</button><button id="pause" class="secondary">Duraklat</button></div><div class="hint">Test modu · TikTok LIVE bağlantısı henüz kurulmadı · Yayın görünümü: ?view=live</div></section></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=540,H=960;
const $=id=>document.getElementById(id);
const center={x:270,y:475},radii=[89,132,174,215,252],capacity=[10,18,24,30,36];
const members=[],readers=[{x:56,y:282},{x:484,y:282},{x:62,y:735},{x:478,y:735}];
let rings=1,paused=false,last=performance.now(),clock=0,serial=0;
function join(name){if(members.length>=capacity.slice(0,5).reduce((a,b)=>a+b,0))return;const i=members.length;let r=0,j=i;while(j>=capacity[r]&&r<4){j-=capacity[r];r++}if(r+1>rings)rings=r+1;members.push({name:name||'Misafir '+(++serial),r,slot:j,seed:Math.random()*6.28});$('toast').textContent='✦ '+members[members.length-1].name+' halkaya katıldı ✦';$('toast').classList.add('on');clearTimeout(join.t);join.t=setTimeout(()=>$('toast').classList.remove('on'),1800);update();}
function update(){$('count').textContent='Katılımcı: '+members.length;$('ring').textContent='Halka: '+rings+' / 5';}
$('join').onclick=()=>{join($('username').value.trim());$('username').value=''};$('username').onkeydown=e=>{if(e.key==='Enter')$('join').click()};
$('add10').onclick=()=>{for(let i=0;i<10;i++)join('Misafir '+(++serial))};
$('ringBtn').onclick=()=>{rings=Math.min(5,rings+1);update()};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Devam et':'Duraklat'};
if(new URLSearchParams(location.search).get('view')==='live')document.body.classList.add('live');
window.zikirJoin=(name)=>join(String(name||'Misafir'));window.zikirAddRing=()=>{rings=Math.min(5,rings+1);update()};
function ellipse(x,y,rx,ry,fill,stroke,lw=1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x,y,x2,y2,color,width=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function person(x,y,scale,style=0,t=0){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const sway=Math.sin(t)*2.5;ellipse(0,14,12,4,'#0005');ctx.translate(sway,0);ctx.fillStyle=style===1?'#d9c29a':style===2?'#4c785a':'#e8e0c9';ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(9,-7);ctx.lineTo(13,13);ctx.lineTo(-13,13);ctx.closePath();ctx.fill();line(-6,11,-6,17,'#382c29',3);line(6,11,6,17,'#382c29',3);line(-8,-5,-13,5,'#b6a27f',4);line(8,-5,13,5,'#b6a27f',4);ellipse(0,-16,7,9,'#d3a97e');ellipse(0,-24,10,5,style===2?'#e4b85d':'#f6eee0','#b59b70');ellipse(0,-27,6,3,'#f5e9d2');ctx.restore()}
function room(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#143e3c');g.addColorStop(.45,'#477466');g.addColorStop(1,'#143b33');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++){const x=i*92-10;ctx.fillStyle='#c9a96a';ctx.fillRect(x,160,7,620);ctx.fillStyle='#103c36';ctx.fillRect(x+7,160,80,620)}for(let i=0;i<7;i++){const x=i*92+36;ellipse(x,169,39,60,'#174d45','#d2b477',5);ctx.fillStyle='#174d45';ctx.fillRect(x-38,170,76,50)}ctx.fillStyle='#9e8357';ctx.fillRect(0,770,W,14);ctx.fillStyle='#a99169';ctx.fillRect(0,784,W,176);for(let i=0;i<30;i++){line(0,790+i*7,W,790+i*7,'#755e4590',1)}ellipse(center.x,center.y,270,220,'#745840','#d9b878',5);ellipse(center.x,center.y,259,210,'#23574b','#d2b87e',3);for(let i=0;i<16;i++){const a=i*Math.PI/8;line(center.x+248*Math.cos(a),center.y+200*Math.sin(a),center.x+263*Math.cos(a),center.y+211*Math.sin(a),'#d5bd83',2)}ellipse(center.x,center.y,77,61,'#3c6c54','#d5b66d',4);for(let i=0;i<5;i++)ellipse(center.x,center.y,radii[i],radii[i]*.78,null,'#d9bd7a65',1)}
function lantern(x,y){line(x,195,x,229,'#f5dba5',2);ellipse(x,244,10,19,'#ffdb7d','#d7b56b',3);ellipse(x,244,21,29,null,'#e3bc73',2)}
function reader(x,y,t){ctx.save();ctx.translate(x,y);ellipse(0,17,30,10,'#0004');person(0,0,1.35,2,t*.35);ctx.fillStyle='#a98145';ctx.fillRect(-21,17,42,4);line(-20,16,0,0,'#9c6d39',4);line(20,16,0,0,'#9c6d39',4);ctx.fillStyle='#f3e7bc';ctx.beginPath();ctx.moveTo(-20,-1);ctx.lineTo(0,5);ctx.lineTo(20,-1);ctx.lineTo(20,9);ctx.lineTo(0,14);ctx.lineTo(-20,9);ctx.closePath();ctx.fill();line(0,5,0,14,'#b49b69',1);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);room();lantern(90,190);lantern(450,190);readers.forEach((p,i)=>reader(p.x,p.y,clock+i));for(let r=0;r<rings;r++){const rx=radii[r],ry=rx*.78;const list=members.filter(m=>m.r===r);const base=(r%2?-1:1)*clock*(.05-r*.004);for(const m of list){const a=(m.slot/capacity[r])*Math.PI*2+base;const x=center.x+rx*Math.cos(a),y=center.y+ry*Math.sin(a);person(x,y,.7+r*.04,r===0?2:0,clock*1.4+m.seed)}}person(242,472,1.25,2,clock*.8);person(298,472,1.25,2,clock*.8+1);person(270,504,1.25,2,clock*.8+2);ctx.textAlign='center';ctx.font='bold 12px Georgia';ctx.fillStyle='#f9dfa2';ctx.fillText('3 HOCA',270,544);ctx.textAlign='start'}
function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)clock+=dt;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);update();
</script></body></html>
