<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zikir Halkası | LIVE</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c19;color:#f8eed5;font:13px system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);aspect-ratio:9/16;position:relative;overflow:hidden;background:#163d33}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:3%;left:4%;right:4%;pointer-events:none;text-align:center;text-shadow:0 2px 7px #000}.hud h1{margin:0;color:#ffe2a1;font:700 26px Georgia}.hud .stats{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}.stats span,.toast{background:#0a322cda;border:1px solid #c9a769;border-radius:10px;padding:7px}.toast{position:absolute;top:17%;left:7%;right:7%;text-align:center;color:#ffe5ac;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700}.toast.on{opacity:1}.panel{position:absolute;bottom:1%;left:3%;right:3%;background:#08251fe8;border:1px solid #cba867;border-radius:12px;padding:9px;display:grid;gap:6px}.panel input,.panel select{min-width:0;width:100%;border:0;border-radius:5px;padding:8px}.panel .row{display:flex;gap:5px}.panel button{flex:1;border:1px solid #bfa76b;background:#28644b;color:white;padding:8px 3px;border-radius:6px;font-size:11px;cursor:pointer}.panel small{font-size:10px;color:#e6d6b5}body.live .panel{display:none}</style></head><body><main class="phone"><canvas id="scene" width="540" height="960"></canvas><div class="hud"><h1>✦ ZİKİR HALKASI ✦</h1><div class="stats"><span id="count">Katılımcı 0</span><span id="leader">En yüksek destek: —</span></div></div><div id="toast" class="toast"></div><div class="panel"><div class="row"><input id="user" placeholder="Kullanıcı adı" value="misafir"><input id="comment" placeholder="Yorum / zikir"></div><div class="row"><button id="say">Yorum gönder</button><button id="join">Zikir yaz</button><button id="coin1">+1 jeton</button><button id="coin100">+100 jeton</button></div><div class="row"><button id="coin500">+500 jeton</button><button id="sample">Örnek kalabalık</button><button id="cam">Kamera: otomatik</button><button id="mute">Ses: açık</button></div><small>Demo: TikTok bağlantısı henüz yok. Yayın görünümü için ?view=live. Tarayıcı seslendirmesi, yapay zekâ TTS entegrasyonunun yerini geçici olarak tutar.</small></div></main><script>
const c=document.getElementById('scene'),g=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2;
const center={x:650,y:650},radii=[130,205,280,355,430],caps=[10,24,32,40,48],people=new Map();let total=0,clock=0,previous=performance.now(),auto=true,muted=false,focus=null,focusUntil=0,toastTimer=0;
let cam={x:650,y:650,zoom:.58},target={x:650,y:650,zoom:.58},voiceQueue=[];
const readers=[{x:150,y:170},{x:1150,y:170},{x:150,y:1130},{x:1150,y:1130}],teacherPos=[{x:595,y:630},{x:705,y:630},{x:650,y:710}];
function get(name){name=String(name||'misafir').replace(/^@/,'').trim().slice(0,24)||'misafir';if(!people.has(name)){people.set(name,{name,coins:0,joined:false,bubble:'',bubbleUntil:0,teacherUntil:0,joinOrder:++total});}return people.get(name)}
function notify(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2500)}
function join(name){let p=get(name);if(!p.joined){p.joined=true;notify('✦ @'+p.name+' zikir halkasına katıldı ✦')}refresh();return p}
function comment(name,msg){let p=join(name);p.bubble=String(msg||'zikir').slice(0,55);p.bubbleUntil=performance.now()+4500;if(msg.toLocaleLowerCase('tr').includes('zikir'))notify('@'+p.name+' halkaya katıldı');}
function rank(){return [...people.values()].filter(p=>p.joined).sort((a,b)=>b.coins-a.coins||a.joinOrder-b.joinOrder)}
function refresh(){let a=rank();$('count').textContent='Katılımcı: '+a.length;$('leader').textContent='En yüksek destek: '+(a[0]?'@'+a[0].name:'—')}
function speak(text){if(muted||!('speechSynthesis' in window))return;let u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';u.rate=.85;u.pitch=.92;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function prayer(p){focus=p.name;focusUntil=performance.now()+12000;p.bubble='Allah dualarını kabul eylesin. Âmin!';p.bubbleUntil=performance.now()+11000;notify('🤲 @'+p.name+' için dua ediliyor · HEP BİRLİKTE ÂMİN');speak('Allah’ım, bu kardeşimizin kalbinden geçen bütün hayırlı dualarını kabul eyle. Hakkında hayırlı olan muradını nasip eyle. Âmin. Hep birlikte âmin.')}
function gift(name,coins){let p=join(name),before=Math.floor(p.coins/100);p.coins+=Math.max(1,Math.floor(coins));notify('✦ @'+p.name+' · '+coins+' jeton ✦');if(Math.floor(p.coins/100)>before)prayer(p);if(rank()[0]===p&&p.coins>0){p.teacherUntil=performance.now()+60000;}refresh()}
function placements(){let all=rank(),out=new Map();let special=all.filter(p=>p.coins>0).slice(0,10),teacher=all.filter(p=>p.teacherUntil>performance.now()).slice(0,1);let reading=all.filter(p=>p.coins>0&&!teacher.includes(p)).slice(0,4);
teacher.forEach((p,i)=>out.set(p.name,{x:teacherPos[i].x,y:teacherPos[i].y,kind:'teacher'}));reading.forEach((p,i)=>out.set(p.name,{...readers[i],kind:'reader'}));
let circles=[[],[],[],[],[]];special.filter(p=>!out.has(p.name)).forEach(p=>circles[0].push(p));all.filter(p=>!special.includes(p)&&!out.has(p.name)).forEach(p=>{let i=1;while(i<4&&circles[i].length>=caps[i])i++;circles[i].push(p)});for(let i=0;i<5;i++){let list=circles[i];list.forEach((p,j)=>{let a=j/Math.max(caps[i],list.length)*TAU+(i%2?-1:1)*clock*.045;out.set(p.name,{x:center.x+Math.cos(a)*radii[i],y:center.y+Math.sin(a)*radii[i]*.83,kind:i===0?'special':'normal',angle:a})})}return out}
function ellipse(x,y,rx,ry,fill,stroke,width=1){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function text(s,x,y,size=15,color='#fff',stroke=true){g.font='bold '+size+'px system-ui';g.textAlign='center';if(stroke){g.strokeStyle='#09241f';g.lineWidth=4;g.strokeText(s,x,y)}g.fillStyle=color;g.fillText(s,x,y)}
function person(x,y,kind,t,name,bubble){g.save();g.translate(x,y);let scale=kind==='teacher'?1.7:kind==='reader'?1.35:kind==='special'?1.15:1;g.scale(scale,scale);ellipse(0,23,14,5,'#071d1980');g.rotate(Math.sin(t*1.4)*.027);g.fillStyle=kind==='teacher'?'#a98b4c':kind==='special'?'#d6c5a0':'#315d47';g.beginPath();g.moveTo(-11,-5);g.lineTo(11,-5);g.lineTo(15,20);g.lineTo(-15,20);g.fill();ellipse(0,-17,8,10,'#d9b08b');ellipse(0,-26,12,6,'#f1e8d6','#b89a64',2);ellipse(0,-30,7,3,'#f1e8d6');g.restore();if(name)text('@'+name,x,y-42*scale,13,'#fff2c0');if(bubble){let s=bubble.slice(0,32);let w=Math.min(330,Math.max(100,s.length*8+24));g.fillStyle='#fff5df';g.strokeStyle='#b89459';g.lineWidth=2;g.beginPath();g.roundRect(x-w/2,y-92,w,35,9);g.fill();g.stroke();text(s,x,y-70,12,'#243c2e',false)}}
function room(){let bg=g.createLinearGradient(0,0,0,1300);bg.addColorStop(0,'#0c3532');bg.addColorStop(.5,'#3d6b59');bg.addColorStop(1,'#112d2b');g.fillStyle=bg;g.fillRect(0,0,1300,1300);for(let i=0;i<9;i++){let x=i*160;g.fillStyle='#c8a56c';g.fillRect(x,0,12,1300);ellipse(x+80,100,70,110,'#0b3430','#c5a66d',8)}ellipse(650,650,495,445,'#714b35','#c9aa69',15);ellipse(650,650,478,427,'#285a49','#d6b87b',7);for(let r of radii)ellipse(650,650,r,r*.83,null,'#bba56b80',3);ellipse(650,650,87,78,'#9c6949','#e4c47d',6);for(let i=0;i<4;i++){let p=readers[i];ellipse(p.x,p.y+25,50,25,'#6a4437','#d7b97c',3);g.fillStyle='#c9a267';g.fillRect(p.x-25,p.y+10,50,8);g.fillStyle='#f5e3b8';g.fillRect(p.x-19,p.y-4,38,20)}}
function render(now){let dt=Math.min(.05,(now-previous)/1000);previous=now;clock+=dt;let pos=placements(),active=focus&&now<focusUntil?pos.get(focus):null;
if(active){target={x:active.x,y:active.y,zoom:1.7}}else{focus=null;if(auto){let a=clock*.13;target={x:center.x+Math.sin(a)*190,y:center.y+Math.cos(a*.7)*190,zoom:.7+Math.sin(clock*.09)*.12}}}
cam.x+=(target.x-cam.x)*.028;cam.y+=(target.y-cam.y)*.028;cam.zoom+=(target.zoom-cam.zoom)*.025;
g.clearRect(0,0,540,960);g.fillStyle='#0b2b27';g.fillRect(0,0,540,960);g.save();g.translate(270,475);g.scale(cam.zoom,cam.zoom);g.translate(-cam.x,-cam.y);room();
let figures=[];for(let i=0;i<3;i++)figures.push({...teacherPos[i],kind:'teacher',t:clock+i,name:i===0?'HOCA 1':i===1?'HOCA 2':'HOCA 3'});
for(let i=0;i<4;i++)figures.push({...readers[i],kind:'reader',t:clock+i,name:'Kur’an okuyucu'});
for(let [name,p] of pos){let u=people.get(name);figures.push({...p,t:clock+u.joinOrder*.3,name,bubble:u.bubbleUntil>now?u.bubble:''})}
figures.sort((a,b)=>a.y-b.y);figures.forEach(p=>person(p.x,p.y,p.kind,p.t,p.name,p.bubble));g.restore();requestAnimationFrame(render)}
requestAnimationFrame(render);
$('join').onclick=()=>join($('user').value);$('say').onclick=()=>comment($('user').value,$('comment').value);$('coin1').onclick=()=>gift($('user').value,1);$('coin100').onclick=()=>gift($('user').value,100);$('coin500').onclick=()=>gift($('user').value,500);$('sample').onclick=()=>{for(let i=0;i<70;i++)join('izleyici'+(i+1));gift('destekci',120);refresh()};$('cam').onclick=()=>{auto=!auto;target={x:650,y:650,zoom:.58};$('cam').textContent=auto?'Kamera: otomatik':'Kamera: sabit'};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Ses: kapalı':'Ses: açık'};
if(new URLSearchParams(location.search).get('view')==='live')document.body.classList.add('live');
window.zikirLive={join,comment,gift,prayer,rank};
</script></body></html>
