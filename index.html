<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem • 3D Saray Düğünü</title><style>*{box-sizing:border-box}body{margin:0;background:#17121b;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.phone{position:relative;width:min(100vw,430px);height:min(100dvh,764px);aspect-ratio:9/16;overflow:hidden;background:#d6b990}canvas{display:block;width:100%;height:100%}.header{position:absolute;top:2%;width:100%;text-align:center;text-shadow:0 2px 5px #381a18}.header small{background:#672639c9;padding:5px 12px;border-radius:15px}.header h1{font: bold clamp(19px,5vw,27px) Georgia,serif;color:#ffe6b2;margin:12px 0}.demo{position:absolute;right:3%;top:2%;background:#d32d41;border-radius:9px;padding:6px;font-size:11px}.names{position:absolute;top:64%;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}.names span{background:#44202ddf;border:1px solid #dfb570;padding:5px 8px;border-radius:18px;font-size:11px;font-weight:bold}.status{position:absolute;bottom:15%;left:4%;font-size:12px;text-shadow:0 2px 3px #24121c}.buttons{position:absolute;bottom:1%;left:2%;right:2%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.buttons button{color:white;background:#532333ed;border:1px solid #e7bd78;border-radius:9px;padding:10px 2px;font-size:11px;cursor:pointer}.buttons button:active{background:#8b4051}</style></head><body><div class="phone"><div id="scene" style="width:100%;height:100%"></div><div class="header"><small>✦ SARAY DÜĞÜNÜ ✦</small><h1>Hürrem Sultan &amp;<br>Kanuni Sultan Süleyman</h1></div><div class="demo">● 3D DEMO</div><div class="names"><span id="sultan">👑 @suleyman</span><span id="hurrem">👑 @hurrem</span></div><div class="status" id="status">3D sahne hazır • Butonları dene</div><div class="buttons"><button id="guest">🌹 Davetli ekle</button><button id="band">🥁 Mehter ekle</button><button id="court">✨ Erkân ekle</button><button id="king">👑 Süleyman ol</button><button id="queen">👑 Hürrem ol</button><button id="reset">↻ Sıfırla</button></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const mount=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#a8c8d6');scene.fog=new THREE.Fog('#a8c8d6',22,65);
const camera=new THREE.PerspectiveCamera(39,9/16,.1,120);camera.position.set(9,13,24);camera.lookAt(0,2,-3);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(mount.clientWidth,mount.clientHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#96725e',2.5));const sun=new THREE.DirectionalLight('#fff0d0',3);sun.position.set(-8,18,11);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
function mat(c,metalness=0){return new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness})}
const cream=mat('#f4e8d6'),skin=mat('#e5ad83'),black=mat('#30231e'),gold=mat('#e4b85d',.3),red=mat('#992c3e'),stone=mat('#e8caa5');
function mesh(g,m,p,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(w,h,d,m,p,parent){return mesh(new THREE.BoxGeometry(w,h,d),m,p,parent)}
function sphere(r,m,p,parent,s=[1,1,1]){let o=mesh(new THREE.SphereGeometry(r,16,12),m,p,parent);o.scale.set(...s);return o}
function cyl(rt,rb,h,m,p,parent){return mesh(new THREE.CylinderGeometry(rt,rb,h,16),m,p,parent)}
box(80,.15,90,stone,[0,-.1,-8]);box(4,.04,70,red,[0,.02,-8]);for(let i=-2;i<=2;i++){box(.07,.05,70,gold,[i*.75,.06,-8])}
for(let z=-29;z<=5;z+=5){for(let side of [-1,1]){const x=side*5.6;cyl(.55,.7,6,cream,[x,3,z]);cyl(.78,.78,.45,gold,[x,6.15,z]);box(2,.7,1.5,stone,[x,6.7,z]);}}
box(15,9,2,stone,[0,4,-37]);const dome=sphere(5,mat('#8ca4a4'),[0,10,-37],scene,[1,.55,.75]);box(4,6,.5,mat('#663d3c'),[0,3,-35.9]);
const characters=[];function person(type,x,z,scale=1){const root=new THREE.Group();scene.add(root);root.position.set(x,0,z);root.scale.setScalar(scale);const female=type==='hurrem',king=type==='sultan',band=type==='Mehteran',court=type==='Saray Erkânı';const cloth=mat(female?'#b43b55':king?'#982d38':band?'#b93c3e':court?'#254c70':'#536a54');cyl(.39,.6,1.7,cloth,[0,1.15,0],root);cyl(.41,.41,.1,gold,[0,1.45,0],root);for(let a of [-1,1]){let arm=sphere(.2,cloth,[a*.55,1.5,0],root,[.8,2.4,.8]);let leg=box(.27,.5,.34,black,[a*.24,.22,.03],root)}sphere(.49,skin,[0,2.55,0],root,[1,.98,.9]);for(let a of [-1,1])sphere(.045,black,[a*.18,2.58,.43],root);if(!female){sphere(.24,black,[0,2.27,.29],root,[1,.48,.65]);cyl(.49,.53,.28,cream,[0,3.02,0],root);sphere(.53,cream,[0,3.12,0],root,[1,.35,1]);if(king){sphere(.14,gold,[0,3.43,0],root);sphere(.09,red,[0,3.49,.11],root)}}else{sphere(.55,mat('#8e4c32'),[0,2.8,-.15],root,[1,1.2,.6]);cyl(.43,.5,.2,gold,[0,3.13,0],root);for(let a of [-1,0,1])sphere(.09,red,[a*.23,3.28,0],root)}if(king||female){for(let a of [-1,1])box(.08,1.4,.05,gold,[a*.32,1.12,.43],root)}if(band){cyl(.38,.38,.2,mat('#cfa66b'),[0,1.3,.48],root).rotation.x=Math.PI/2}characters.push({root,type,seed:Math.random()*10,baseZ:z});return root}
person('sultan',-1.25,5,1.35);person('hurrem',1.25,5,1.35);for(let i=0;i<16;i++)person(i%5===0?'Mehteran':i%3===0?'Saray Erkânı':'Davetli Halk',(-2.8+(i%4)*1.85),-1-Math.floor(i/4)*3,.85);
let n=0;function join(type){n++;let col=n%6;person(type,-3.5+col*1.4,-13-Math.floor(n/6)*2.2,.8);document.getElementById('status').textContent='🎉 @misafir'+n+' katıldı: '+type}
function crown(id){n++;document.getElementById(id).textContent='👑 @misafir'+n;document.getElementById('status').textContent='Yeni '+(id==='sultan'?'Süleyman':'Hürrem')+' seçildi!'}
document.getElementById('guest').onclick=()=>join('Davetli Halk');document.getElementById('band').onclick=()=>join('Mehteran');document.getElementById('court').onclick=()=>join('Saray Erkânı');document.getElementById('king').onclick=()=>crown('sultan');document.getElementById('queen').onclick=()=>crown('hurrem');document.getElementById('reset').onclick=()=>location.reload();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime();for(let c of characters){c.root.position.y=Math.sin(t*3+c.seed)*.035;c.root.rotation.y=Math.sin(t*.7+c.seed)*.035}renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{let w=mount.clientWidth,h=mount.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)});
</script></body></html>
