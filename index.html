<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Zikir Halkası</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a15;color:#f9edcf;font:13px system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);position:relative;overflow:hidden;background:#103d30}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:2%;left:3%;right:3%;text-align:center;pointer-events:none;text-shadow:0 2px 5px #000}.hud h1{font:700 24px Georgia;margin:0;color:#ffda89}.stats{display:flex;justify-content:space-between;margin-top:8px}.stats span,.toast{background:#103a30df;border:1px solid #c9a763;border-radius:9px;padding:7px}.toast{position:absolute;top:15%;left:5%;right:5%;padding:10px;text-align:center;background:#153e32ee;border:1px solid #e0bc72;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}.panel{position:absolute;bottom:1%;left:3%;right:3%;background:#08271fe8;border:1px solid #bca36a;border-radius:12px;padding:9px;display:grid;gap:6px}.panel .row{display:flex;gap:5px}.panel input{min-width:0;width:100%;padding:8px;border-radius:6px;border:0}.panel button{flex:1;border:1px solid #bda36b;background:#24634b;color:white;border-radius:6px;padding:8px 2px;font-size:11px;cursor:pointer}.panel small{font-size:10px;color:#decda8}body.live .panel{display:none}.tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none;color:#fff2c4}.bubble{display:block;background:#fff3d5;color:#173c2e;padding:5px;border-radius:8px;text-shadow:none;margin-bottom:4px;max-width:190px;overflow:hidden;text-overflow:ellipsis}</style></head><body><main class="phone"><div id="view"></div><div id="tags"></div><div class="hud"><h1>✦ ZİKİR HALKASI ✦</h1><div class="stats"><span id="count">Katılımcı: 0</span><span id="leader">En yüksek destek: —</span></div></div><div id="toast" class="toast"></div><div class="panel"><div class="row"><input id="user" value="misafir" placeholder="Kullanıcı adı"><input id="comment" placeholder="Yorum: zikir / dua"></div><div class="row"><button id="say">Yorum</button><button id="join">Zikir</button><button id="coin1">+1 jeton</button><button id="coin100">+100 jeton</button></div><div class="row"><button id="coin500">+500 jeton</button><button id="sample">Kalabalık</button><button id="cam">Kamera: otomatik</button><button id="mute">Ses: açık</button></div><small>3D test · Fareyle döndür, sürükle ve tekerlekle yaklaş. Gerçek TikTok bağlantısı henüz yok.</small></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),host=$('view'),world=new THREE.Scene();world.background=new THREE.Color(0x10392f);world.fog=new THREE.Fog(0x10392f,95,180);world.add(new THREE.HemisphereLight(0xffe6b5,0x4c7861,3.2));const sun=new THREE.DirectionalLight(0xfff2d4,3.0);sun.position.set(8,28,20);world.add(sun);const fill=new THREE.DirectionalLight(0xc3e9dc,1.6);fill.position.set(-20,16,-5);world.add(fill);
const camera=new THREE.PerspectiveCamera(48,540/960,.1,170),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth||540,host.clientHeight||960);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness:metal,side:THREE.DoubleSide});
const M={green:mat('#145b3d'),deep:mat('#103f34'),gold:mat('#d6af61',.28),cream:mat('#e8ddbf'),wall:mat('#e4d4b2'),teal:mat('#1d6a65'),brown:mat('#84512e'),white:mat('#eee4cd'),skin:mat('#cda17d'),beard:mat('#42362f'),navy:mat('#283c58'),burgundy:mat('#643642'),grey:mat('#858a87'),bright:mat('#b98c37'),glass:mat('#77aba0')};
function mesh(geo,material,parent=world,x=0,y=0,z=0){let o=new THREE.Mesh(geo,material);o.position.set(x,y,z);parent.add(o);return o}
function cube(w,h,d,m,x,y,z,p=world){return mesh(new THREE.BoxGeometry(w,h,d),m,p,x,y,z)}
function cyl(r,h,m,x,y,z,p=world,r2=r){return mesh(new THREE.CylinderGeometry(r2,r,h,16),m,p,x,y,z)}
function ball(r,m,x,y,z,p=world){return mesh(new THREE.SphereGeometry(r,12,8),m,p,x,y,z)}
function hoop(r,m,y=0.09){let o=mesh(new THREE.TorusGeometry(r,.035,5,128),m,world,0,y,0);o.rotation.x=Math.PI/2}
cube(76,.4,76,M.wall,0,-.23,0);cube(75,.08,75,M.green,0,.03,0);
for(let r of [3,7,12,17,22,27])hoop(r,M.gold);
for(let x of [-37.5,37.5])cube(.6,24,76,M.wall,x,12,0);
cube(76,24,.6,M.wall,0,12,-37.5);
cube(76,1.2,.18,M.teal,0,21,-37.15);cube(76,.15,.22,M.gold,0,20.25,-37.04);
cube(9,13,.45,M.gold,0,11,-37.1);cube(8.2,12.2,.4,M.deep,0,11,-36.8);
cube(6,.08,8,M.gold,0,.12,-29);cube(5.6,.09,7.6,M.green,0,.18,-29);
for(let x of [-31,-25,25,31]){cube(3.7,8,.2,M.gold,x,12,-37);cube(3.3,7.6,.21,M.glass,x,12,-36.85);cube(.12,7.6,.23,M.gold,x,12,-36.72);cube(3.3,.12,.23,M.gold,x,12,-36.72)}
function plaque(word,x){const c=document.createElement('canvas');c.width=c.height=512;const q=c.getContext('2d');q.fillStyle='#0f5741';q.beginPath();q.arc(256,256,239,0,Math.PI*2);q.fill();q.lineWidth=19;q.strokeStyle='#e6c278';q.stroke();q.fillStyle='#f5e5b9';q.textAlign='center';q.textBaseline='middle';q.font='bold 225px serif';q.fillText(word,256,265);let tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const p=mesh(new THREE.PlaneGeometry(6.3,6.3),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}),world,x,12.5,-36.7);return p}
plaque('الله',-13);plaque('محمد',13);
for(let x of [-34,34])for(let z of [-31,29]){cyl(.52,19,M.cream,x,9.5,z);cyl(.84,.45,M.gold,x,.25,z);cyl(.85,.5,M.gold,x,19.1,z)}
for(let x of [-18,18])for(let z of [-18,18]){cyl(.045,3,M.gold,x,21,z);cyl(.48,1.1,M.gold,x,19.2,z);cyl(.62,.16,M.brown,x,19.83,z)}
for(let x of [-30,30])for(let z of [-29,29]){cube(1.7,.12,1.15,M.brown,x,.96,z);cube(.12,1.6,.12,M.brown,x-.5,.4,z);cube(.12,1.6,.12,M.brown,x+.5,.4,z);cube(1.3,.07,.85,M.cream,x,1.05,z)}
// geometric wall stars
for(let x=-34;x<=34;x+=3){let star=new THREE.Group();world.add(star);star.position.set(x,21,-36.96);for(let i=0;i<8;i++){let a=i*Math.PI/4;let bar=cube(.06,.8,.045,M.gold,Math.cos(a)*.2,Math.sin(a)*.2,0,star);bar.rotation.z=-a}}
// Three hocas and three distinct congregation models
function character(type){let root=new THREE.Group();world.add(root);let robe=type==='hoca1'?M.green:type==='hoca2'?M.navy:type==='hoca3'?M.burgundy:type==='grey'?M.grey:type==='gold'?M.bright:M.teal;
let torso=mesh(new THREE.CylinderGeometry(.39,.72,2.15,12),robe,root,0,1.32,0);cyl(.72,.12,M.gold,0,.29,0,root);cyl(.4,.1,M.gold,0,1.78,0,root);
for(let side of [-1,1]){let arm=cyl(.2,1.42,robe,side*.61,1.63,0,root);arm.rotation.z=side*.26;ball(.17,M.skin,side*.81,.91,.06,root);cube(.25,.2,.5,M.brown,side*.23,.12,.12,root)}
cyl(.21,.22,M.skin,0,2.48,0,root);ball(.44,M.skin,0,2.92,0,root);ball(.27,M.beard,0,2.68,.26,root);
for(let side of [-1,1])ball(.042,M.deep,side*.16,2.98,.4,root);
cyl(.49,.22,M.white,0,3.38,0,root);cyl(.37,.2,type.startsWith('hoca')?M.cream:M.gold,0,3.56,0,root);cyl(.49,.055,M.gold,0,3.3,0,root);
if(type.startsWith('hoca'))for(let side of [-1,1])cube(.1,1.35,.08,M.gold,side*.31,1.63,.42,root);
else cube(.1,1.1,.09,M.gold,0,1.48,.45,root);
return root}
const hocas=[character('hoca1'),character('hoca2'),character('hoca3')];hocas.forEach((p,i)=>p.position.set((i-1)*2.6,0,-3));
const readers=[[-30,-29],[30,-29],[-30,29],[30,29]].map(([x,z],i)=>{let p=character(i%2?'grey':'green');p.position.set(x,0,z);p.scale.setScalar(.8);return p});
let users=new Map(),clock=0,auto=true,muted=false,focus=null,focusEnd=0,notifyTimer,roleEnd=0,teacherUser=null,camTarget=new THREE.Vector3(0,0,0),radius=37,az=Math.PI,el=.98,drag=false,last={x:0,y:0},manual=false;
function notice(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>$('toast').classList.remove('on'),2500)}
function user(name){name=String(name||'misafir').trim().replace(/^@/,'').slice(0,20)||'misafir';if(!users.has(name)){let p={name,coins:0,credits:0,joined:false,bubble:'',bubbleEnd:0,order:users.size,model:character('green')};p.model.visible=false;let tag=document.createElement('div');tag.className='tag';tag.textContent='@'+name;$('tags').appendChild(tag);p.tag=tag;users.set(name,p)}return users.get(name)}
function ranking(){return [...users.values()].filter(p=>p.joined).sort((a,b)=>b.coins-a.coins||a.order-b.order)}
function refresh(){let a=ranking();$('count').textContent='Katılımcı: '+a.length;$('leader').textContent='En yüksek destek: '+(a[0]?'@'+a[0].name:'—')}
function join(n){let p=user(n);if(!p.joined){p.joined=true;p.model.visible=true;notice('@'+p.name+' halkaya katıldı')}refresh();return p}
function speech(t){if(muted||!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}
function prayer(p){focus=p;focusEnd=performance.now()+12000;p.bubble='Allah dualarını kabul eylesin. Âmin!';p.bubbleEnd=performance.now()+10000;notice('🤲 @'+p.name+' için dua · HEP BİRLİKTE ÂMİN');speech('Allah’ım, bu kardeşimizin kalbinden geçen bütün hayırlı dualarını kabul eyle. Hakkında hayırlı olan muradını nasip eyle. Âmin. Hep birlikte âmin.')}
function comment(n,t){t=String(t||'').trim();let p=user(n);if(t.toLocaleLowerCase('tr')==='zikir')join(n);else if(t.toLocaleLowerCase('tr')==='dua'){if(p.credits>0){p.credits--;prayer(p)}else notice('@'+p.name+' · Dua için 100 jetonluk hak gerekli')}if(p.joined){p.bubble=t.slice(0,35);p.bubbleEnd=performance.now()+4500}}
function gift(n,amount){let p=join(n),old=Math.floor(p.coins/100);p.coins+=amount;p.credits+=Math.floor(p.coins/100)-old;notice('@'+p.name+' +'+amount+' jeton'+(p.credits?' · dua hakkı: '+p.credits:''));if(ranking()[0]===p){teacherUser=p;roleEnd=performance.now()+60000}refresh()}
const prototypes={green:M.teal,grey:M.grey,gold:M.bright};
function updatePeople(t){let all=ranking(),special=all.filter(p=>p.coins>0).slice(0,10),others=all.filter(p=>!special.includes(p)),now=performance.now();
all.forEach((p,i)=>{let tier=special.includes(p)?0:1+Math.floor(others.indexOf(p)/38),r=[5.7,9,13.5,18,23,28][Math.min(5,tier)],idx=tier===0?special.indexOf(p):others.indexOf(p)%38,capacity=tier===0?10:38,a=idx/capacity*Math.PI*2+clock*(tier%2?.04:-.05);p.model.position.set(Math.cos(a)*r,0,Math.sin(a)*r);p.model.rotation.y=-a;p.model.children[0].material=p.coins>=500?prototypes.gold:p.coins>0?prototypes.green:(i%2?prototypes.grey:prototypes.green);p.model.rotation.z=Math.sin(clock*2+i)*.018;p.model.visible=true;
if(p===teacherUser&&now<roleEnd){p.model.position.copy(hocas[0].position);p.model.position.x+=.4;hocas[0].visible=false}else if(i===0)hocas[0].visible=true;
let q=p.model.position.clone();q.y+=4.2;q.project(camera);p.tag.style.left=(q.x*.5+.5)*host.clientWidth+'px';p.tag.style.top=(-q.y*.5+.5)*host.clientHeight+'px';p.tag.style.display=q.z>1?'none':'block';p.tag.innerHTML=(p.bubbleEnd>now?'<span class="bubble">'+p.bubble.replace(/[<>&]/g,'')+'</span>':'')+'@'+p.name;
});if(!teacherUser||now>=roleEnd)hocas[0].visible=true}
function animate(ms){requestAnimationFrame(animate);clock=ms/1000;let now=performance.now();if(focus&&now<focusEnd){camTarget.lerp(focus.model.position,.035);radius+=(10-radius)*.04;el+=(.72-el)*.035}else if(auto){focus=null;az+=.001;radius+=(31+Math.sin(clock*.1)*5-radius)*.015;camTarget.lerp(new THREE.Vector3(Math.sin(clock*.08)*7,0,Math.cos(clock*.08)*7),.015)}else focus=null;
camera.position.set(camTarget.x+Math.sin(az)*Math.sin(el)*radius,camTarget.y+Math.cos(el)*radius+3,camTarget.z+Math.cos(az)*Math.sin(el)*radius);camera.lookAt(camTarget.x,camTarget.y+1,camTarget.z);
const w=host.clientWidth||540,h=host.clientHeight||960;if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}updatePeople(ms);hocas.forEach((p,i)=>p.rotation.z=Math.sin(clock*1.8+i)*.025);renderer.render(world,camera)}
requestAnimationFrame(animate);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last={x:e.clientX,y:e.clientY};auto=false;$('cam').textContent='Kamera: serbest';renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-last.x)*.009;el=Math.max(.2,Math.min(1.5,el+(e.clientY-last.y)*.008));last={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();auto=false;radius=Math.max(5,Math.min(75,radius+e.deltaY*.035));$('cam').textContent='Kamera: serbest'},{passive:false});
$('join').onclick=()=>join($('user').value);$('say').onclick=()=>comment($('user').value,$('comment').value);$('coin1').onclick=()=>gift($('user').value,1);$('coin100').onclick=()=>gift($('user').value,100);$('coin500').onclick=()=>gift($('user').value,500);$('sample').onclick=()=>{for(let i=1;i<=60;i++)join('izleyici'+i);gift('destekci',120)};$('cam').onclick=()=>{auto=!auto;$('cam').textContent=auto?'Kamera: otomatik':'Kamera: serbest'};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Ses: kapalı':'Ses: açık'};
if(new URLSearchParams(location.search).get('view')==='live')document.body.classList.add('live');
window.zikirLive={join,comment,gift,prayer,ranking};
