<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanuni • Karakter Atölyesi</title><style>*{box-sizing:border-box}body{margin:0;background:#16131b;color:#f6e8cf;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,430px);height:min(100dvh,764px);aspect-ratio:9/16;position:relative;overflow:hidden;background:#e8d9c3}#scene{width:100%;height:100%}.heading{position:absolute;top:4%;left:0;right:0;text-align:center;pointer-events:none}.heading small{letter-spacing:2px;color:#6e5147;font-size:10px}.heading h1{font:700 29px Georgia,serif;color:#63372f;margin:8px 0 2px}.heading p{font-size:12px;color:#795d4f;margin:0}.foot{position:absolute;bottom:4%;left:0;right:0;text-align:center;color:#73574b;font-size:11px}.foot strong{display:block;color:#543a31;font-size:12px;margin-bottom:7px}.note{position:absolute;top:2%;right:3%;background:#ffffffb0;color:#765d50;font-size:10px;border-radius:12px;padding:5px 8px}</style></head><body><main class="phone"><div id="scene"></div><div class="heading"><small>OSMANLI KARAKTER ATÖLYESİ</small><h1>Kanuni Sultan Süleyman</h1><p>Sevimli · Minimal · 3D</p></div><div class="note">TEK KARAKTER</div><div class="foot"><strong>İlk karakter tasarımımız</strong>Karakteri inceleyelim, sonra diğerlerine geçelim.</div></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#e8d9c3');
const camera=new THREE.PerspectiveCamera(34,9/16,.1,100);camera.position.set(3.2,3.4,12.8);camera.lookAt(0,2.05,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#b59b85',2.6));const light=new THREE.DirectionalLight('#fff5e6',3.2);light.position.set(-4,9,7);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-8;light.shadow.camera.right=8;light.shadow.camera.top=8;light.shadow.camera.bottom=-8;scene.add(light);
function m(c){const color=new THREE.Color(c);return new THREE.MeshToonMaterial({color,gradientMap:toonGradient})}const toonData=new Uint8Array([80,150,220,255]);const toonGradient=new THREE.DataTexture(toonData,4,1,THREE.RedFormat);toonGradient.magFilter=THREE.NearestFilter;toonGradient.minFilter=THREE.NearestFilter;toonGradient.needsUpdate=true;const red=m('#a82e42'),darkRed=m('#7b2838'),gold=m('#e9bb58'),skin=m('#f1bc91'),cream=m('#fff2df'),brown=m('#4d3024'),boot=m('#302824'),eyes=m('#211b19'),blush=m('#e7a38e');
function part(geo,material,parent,x,y,z){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);if(parent!==scene){const outline=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:'#49332e',side:THREE.BackSide}));outline.scale.setScalar(1.045);o.add(outline)}return o}
function ball(parent,material,x,y,z,sx,sy,sz){const o=part(new THREE.SphereGeometry(1,24,16),material,parent,x,y,z);o.scale.set(sx,sy,sz);return o}
function cylinder(parent,material,top,bottom,h,x,y,z){return part(new THREE.CylinderGeometry(top,bottom,h,32),material,parent,x,y,z)}
function cube(parent,material,w,h,d,x,y,z){return part(new THREE.BoxGeometry(w,h,d),material,parent,x,y,z)}
const ground=part(new THREE.CylinderGeometry(2.7,2.8,.18,64),m('#d7c3a8'),scene,0,-.1,0);
const hero=new THREE.Group();scene.add(hero);
for(let side of [-1,1]){cube(hero,boot,.34,.52,.46,side*.27,.28,.02);ball(hero,boot,side*.27,.08,.19,.23,.12,.31)}
cylinder(hero,red,.52,.78,1.58,0,1.42,0);cylinder(hero,darkRed,.58,.6,.1,0,1.45,0);
for(let side of [-1,1]){cube(hero,cream,.23,1.45,.075,side*.47,1.48,.56);for(let j=0;j<5;j++){ball(hero,gold,side*.47,1.02+j*.23,.62,.075,.07,.025)};ball(hero,gold,side*.48,2.12,.55,.095,.095,.05)}
cube(hero,gold,1.25,.13,.8,0,1.49,0);ball(hero,gold,0,1.5,.45,.23,.23,.08);ball(hero,red,0,1.5,.52,.105,.105,.04);
const arms=[];for(let side of [-1,1]){let pivot=new THREE.Group();pivot.position.set(side*.65,2.18,0);hero.add(pivot);ball(pivot,red,side*.1,-.38,0,.29,.56,.3);ball(pivot,skin,side*.13,-.86,.04,.19,.2,.19);cylinder(pivot,gold,.31,.31,.08,side*.1,-.71,0);arms.push(pivot)}
ball(hero,skin,0,3.04,0,.73,.75,.65);for(let side of [-1,1]){ball(hero,skin,side*.65,3.01,0,.15,.22,.16);ball(hero,eyes,side*.25,3.1,.605,.088,.12,.045);ball(hero,cream,side*.22,3.15,.649,.03,.036,.012);ball(hero,brown,side*.25,3.29,.53,.18,.055,.045);ball(hero,blush,side*.48,2.92,.54,.17,.085,.03)}
ball(hero,blush,0,2.99,.61,.115,.135,.13);
ball(hero,brown,0,2.68,.32,.49,.32,.39);ball(hero,brown,-.22,2.85,.54,.3,.115,.15);ball(hero,brown,.22,2.85,.54,.3,.115,.15);ball(hero,skin,0,2.85,.66,.115,.045,.02);
cylinder(hero,cream,.64,.64,.19,0,3.65,0);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;ball(hero,cream,Math.sin(a)*.28,3.78,Math.cos(a)*.25,.44,.2,.38)}ball(hero,cream,0,3.82,0,.76,.3,.68);ball(hero,gold,0,3.77,.56,.16,.17,.05);ball(hero,red,0,3.79,.61,.085,.1,.04);
const plume=part(new THREE.ConeGeometry(.17,.55,18),gold,hero,0,4.25,.12);plume.rotation.z=-.13;
ball(hero,brown,0,2.27,-.12,.69,.19,.46);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();hero.position.y=Math.sin(t*1.5)*.035;hero.rotation.y=Math.sin(t*.45)*.24;arms[0].rotation.x=Math.sin(t*1.5)*.035;arms[1].rotation.x=-Math.sin(t*1.5)*.035;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)});
</script></body></html>
