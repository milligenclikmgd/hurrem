<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem ve Kanuni | Saray Düğünü 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#16131b;color:#f8eedb;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));aspect-ratio:9/16;position:relative;overflow:hidden;background:#b9c8d4}#scene{width:100%;height:100%}.top{position:absolute;top:3%;width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 8px #0009}.top small{letter-spacing:2px;font-size:10px}.top h1{font:700 26px Georgia,serif;margin:8px 0}.status{position:absolute;bottom:16px;left:14px;right:14px;background:#241a21cc;border:1px solid #ffffff33;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}.status b{color:#f5c56d}.status button{background:#a3414b;color:white;border:0;padding:7px 12px;border-radius:7px;cursor:pointer;margin-top:5px}.top{top:5%;}.top h1{font-size:clamp(19px,5vw,27px)}.status{bottom:8px;left:10px;right:auto;max-width:75%;padding:5px 8px;font-size:10px;opacity:.75}.status.ready{display:none}.live-label{position:absolute;top:2%;left:12px;font-size:10px;letter-spacing:1px;color:#fff9df;background:#5c3447a6;padding:6px 10px;border-radius:16px;pointer-events:none}.live-hint{position:absolute;bottom:3%;right:12px;color:#fff;font-size:10px;text-shadow:0 1px 4px #000a;pointer-events:none}</style></head><body><main class="phone"><div id="scene"></div><div class="top"><small>KANUNİ & HÜRREM · DÜĞÜN ALAYI</small><h1>Kanuni &amp; Hürrem</h1></div><div class="live-label">✦ SARAY DÜĞÜNÜ</div><div class="live-hint">Fareyle kamerayı hareket ettir</div><div class="status" id="status">3D modeller yükleniyor…</div></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const host=document.querySelector('#scene'),status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#b9c8d4');const camera=new THREE.PerspectiveCamera(43,9/16,.1,300);camera.position.set(0.02,4.17,-3.85);camera.lookAt(0.04,3.08,-1.07);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(.04,3.08,-1.07);controls.enableDamping=true;controls.dampingFactor=.09;controls.minDistance=.6;controls.maxDistance=75;controls.maxPolarAngle=Math.PI*.98;controls.update();scene.add(new THREE.HemisphereLight('#fff6e9','#938778',1.45));const sun=new THREE.DirectionalLight('#fff3df',1.85);sun.position.set(-8,18,9);sun.castShadow=true;scene.add(sun);
const loader=new GLTFLoader();const models=[['Meydan','osmanli_dugun_meydani_v2.glb',null],['Kanuni','orta_detay_padisah_karakter_v2.glb',[-.33,0,2.7]],['Hürrem','orta_detay_sultan_karakter.glb',[.33,0,2.7]],['Erkek davetli','orta_detay_osmanli_adam_karakter_v2.glb',[-1.5,0,4.1]],['Kadın davetli','orta_detay_osmanli_kadin_karakter.glb',[1.5,0,4.1]],['Mehteran','mehter_karakter_revize.glb',[-1.8,0,4.7]]];let loaded=0,failed=[];const people=[];let courtyard=null;
async function addModel([label,file,pos]){try{const gltf=await loader.loadAsync('./'+file);const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=pos?((label==='Kanuni'||label==='Hürrem')?0.43:0.37)/Math.max(size.y,.001):23/Math.max(size.x,size.z,.001);root.scale.setScalar(scale);root.position.set((pos?.[0]||0)-center.x*scale,(pos?.[1]||0)-bounds.min.y*scale,(pos?.[2]||0)-center.z*scale);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});if(pos){root.userData.name=label;root.rotation.y=Math.PI;root.position.y=2.03;root.userData.standY=2.03;root.userData.standPosition=root.position.clone();people.push(root)}else {courtyard=root;root.traverse(o=>{if(o.name&&/Wedding_Floral_Arch/i.test(o.name))o.visible=false;if(o.isMesh&&/Wedding_Carpet_Runner_Long/i.test(o.name)){const mats=Array.isArray(o.material)?o.material:[o.material];o.material=mats.map(m=>{const c=m.clone();if(c.color)c.color.set('#a83d49');return c});if(o.material.length===1)o.material=o.material[0];}});}loaded++;}catch(e){failed.push(label);console.error(label,e)}status.classList.toggle('ready',loaded===6&&failed.length===0);status.innerHTML='<b>'+loaded+'/6 model yüklendi</b>'+ (failed.length?'<div>Eksik dosyalar: '+failed.join(', ')+'</div>':'<div>Daha uzun düğün yolu ve dengeli renkler hazır.</div>')+(failed.length?'<div>GLB dosyalarını GitHub deposunun ana dizinine yükleyin.</div>':'');}
await Promise.all(models.map(addModel));
if(courtyard){courtyard.updateMatrixWorld(true);
 // Eklenen yapay yol kaldırıldı. Orijinal GLB halısının kendi geometrisi uzatılır.
 const runners=[];courtyard.traverse(o=>{if(o.isMesh&&/Wedding_Carpet_Runner_Long/i.test(o.name))runners.push(o)});
 if(runners.length){
   const worldBounds=new THREE.Box3();runners.forEach(o=>worldBounds.expandByObject(o));
   const extent=new THREE.Vector3();worldBounds.getSize(extent);
   const axis=extent.z>=extent.x?'z':'x';
   const start=worldBounds.min[axis];
   const stretch=2.35;
   for(const mesh of runners){
     mesh.updateMatrixWorld(true);
     const toWorld=mesh.matrixWorld.clone(),toLocal=toWorld.clone().invert();
     const geo=mesh.geometry.clone(),position=geo.getAttribute('position');
     const vertex=new THREE.Vector3();
     for(let i=0;i<position.count;i++){
       vertex.fromBufferAttribute(position,i).applyMatrix4(toWorld);
       vertex[axis]=start+(vertex[axis]-start)*stretch;
       vertex.applyMatrix4(toLocal);
       position.setXYZ(i,vertex.x,vertex.y,vertex.z);
     }
     position.needsUpdate=true;geo.computeBoundingBox();geo.computeBoundingSphere();geo.computeVertexNormals();
     mesh.geometry=geo;
   }
 }
const meshes=[];courtyard.traverse(o=>{if(o.isMesh&&!/Sky|Cloud|Dome|Roof|Wall|Canopy/i.test(o.name))meshes.push(o)});const ray=new THREE.Raycaster();for(const p of people){ray.set(new THREE.Vector3(p.position.x,3.1,p.position.z),new THREE.Vector3(0,-1,0));const hits=ray.intersectObjects(meshes,false);const floor=hits.find(h=>h.point.y>=1.9&&h.point.y<=2.6&&h.face&&h.face.normal.y>.45);if(floor)p.position.y=floor.point.y;}}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();for(let i=0;i<people.length;i++){people[i].rotation.y=Math.PI+Math.sin(t*.4+i)*.04;people[i].position.y+=Math.sin(t*2+i)*.00005}controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
</script></body></html>
