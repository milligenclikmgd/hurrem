<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hürrem • Saray Düğünü</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17101b;color:#fff;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100vh}.phone{position:relative;width:min(100vw,430px);aspect-ratio:9/16;max-height:100vh;overflow:hidden;background:linear-gradient(#85b7d7 0%,#e8cba4 52%,#9b4a42 100%)}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:2%;left:3%;right:3%;text-align:center;text-shadow:0 2px 4px #361419}.top h1{font-family:Georgia,serif;font-size:clamp(18px,4.5vw,26px);margin:5px 0;color:#ffe6a4}.top small{background:#671c29b8;border:1px solid #d6aa67;border-radius:12px;padding:5px 10px}.labels{position:absolute;top:57%;width:100%;display:flex;justify-content:space-evenly;font-size:12px;font-weight:bold;text-shadow:0 1px 2px #000}.labels span{background:#381d29d9;border:1px solid #d6a257;border-radius:20px;padding:5px 8px}.controls{position:absolute;bottom:1%;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px}.controls button{background:#511e30ed;border:1px solid #e6b66c;border-radius:10px;color:white;padding:9px 3px;font-size:12px;cursor:pointer}.status{position:absolute;bottom:15%;left:4%;right:4%;font-size:12px;text-shadow:0 1px 3px #000}.badge{position:absolute;right:3%;top:2%;background:#d32c3a;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:bold}</style></head>
<body><div class="phone"><canvas id="scene" width="540" height="960"></canvas><div class="top"><small>✦ SARAY DÜĞÜNÜ ✦</small><h1>Hürrem Sultan &amp;<br>Kanuni Sultan Süleyman</h1></div><div class="badge">● DEMO</div><div class="labels"><span id="sultan">👑 @suleyman</span><span id="hurrem">👑 @hurrem</span></div><div class="status" id="status">Test sürümü: Butonlarla düğüne katıl!</div><div class="controls"><button onclick="join('Davetli Halk')">🌹 Davetli ekle</button><button onclick="join('Mehteran')">🥁 Mehter ekle</button><button onclick="join('Saray Erkânı')">✨ Erkân ekle</button><button onclick="crown('sultan')">👑 Süleyman ol</button><button onclick="crown('hurrem')">👑 Hürrem ol</button><button onclick="reset()">↻ Sıfırla</button></div></div>
<script>
const c=document.getElementById('scene'),x=c.getContext('2d');let people=[],counter=0,t=0;
function join(role){counter++;people.push({role,name:'@misafir'+counter,seed:Math.random()*6});if(people.length>55)people.shift();document.getElementById('status').textContent='🎉 @misafir'+counter+' düğüne katıldı: '+role}
function crown(id){counter++;document.getElementById(id).textContent='👑 @misafir'+counter;document.getElementById('status').textContent='Yeni '+(id==='sultan'?'Süleyman':'Hürrem')+' seçildi!'}
function reset(){people=[];counter=0;document.getElementById('sultan').textContent='👑 @suleyman';document.getElementById('hurrem').textContent='👑 @hurrem';document.getElementById('status').textContent='Yeni düğün turu başladı!'}
function poly(points,fill){x.fillStyle=fill;x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fill()}
function ellipse(cx,cy,rx,ry,color){x.fillStyle=color;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()}
function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(a,b,w,h)}
function character(cx,cy,s,type,seed=0){x.save();x.translate(cx,cy+Math.sin(t*2+seed)*2*s);x.scale(s,s);ellipse(0,7,32,9,'#553f3580');let royal=type==='sultan'||type==='hurrem',female=type==='hurrem',mehter=type==='Mehteran',court=type==='Saray Erkânı';let coat=female?'#a82f51':type==='sultan'?'#8c2633':mehter?'#b43137':court?'#1d4d67':'#52725c';poly([[-21,-80],[21,-80],[31,0],[-31,0]],coat);rect(-19,-79,38,4,'#d8a95e');rect(-3,-76,6,70,royal?'#d6a451':'#caa976');rect(-17,0,12,8,'#30251e');rect(5,0,12,8,'#30251e');ellipse(-27,-54,9,23,coat);ellipse(27,-54,9,23,coat);ellipse(0,-105,25,27,'#e5aa7e');ellipse(-9,-108,2.7,3.8,'#2a2424');ellipse(9,-108,2.7,3.8,'#2a2424');if(!female){ellipse(0,-92,13,8,royal?'#4c2e25':'#573c2b');ellipse(0,-132,28,14,mehter?'#eee0ca':'#f7eddb');ellipse(0,-141,21,13,mehter?'#c73535':'#f5e7d5');}else{poly([[-27,-128],[0,-155],[27,-128]],'#d7a846');ellipse(0,-145,20,8,'#d7a846')}if(royal){ellipse(0,-61,6,6,'#ffdf83');}x.restore()}
function draw(){t+=.016;x.clearRect(0,0,540,960);let g=x.createLinearGradient(0,0,0,960);g.addColorStop(0,'#83bad9');g.addColorStop(.6,'#e7c59c');g.addColorStop(1,'#b86b58');rect(0,0,540,960,g);ellipse(280,210,135,110,'#e6d4ba');rect(120,210,320,310,'#e1b994');for(let i=0;i<7;i++){let a=128+i*42;rect(a,310,21,190,'#b98364');ellipse(a+10,300,16,27,'#f5d5aa')}poly([[190,450],[350,450],[400,520],[140,520]],'#6e3940');poly([[230,500],[310,500],[480,960],[60,960]],'#9d2539');for(let i=0;i<12;i++){let yy=510+i*40;rect(0,yy,540,1,'#ffffff25')}for(let i=0;i<people.length;i++){let p=people[i],row=Math.floor(i/7),col=i%7,px=65+col*68,py=570-row*28+Math.sin(t+p.seed)*3;character(px,py,.5,p.role,p.seed)}character(160,760,1.85,'sultan',0);character(375,760,1.85,'hurrem',1);requestAnimationFrame(draw)}for(let i=0;i<12;i++)join(i%4===0?'Mehteran':i%3===0?'Saray Erkânı':'Davetli Halk');document.getElementById('status').textContent='Test sürümü hazır. Butonları deneyebilirsin.';draw();
</script></body></html>
