const loader=new GLTFLoader();const models=[['Meydan','osmanli_dugun_meydani_v3.glb',null],['Kanuni','orta_detay_padisah_karakter_v2.glb',[-.27,0,4.1]],['Hürrem','orta_detay_sultan_karakter.glb',[.27,0,4.1]],['Erkek davetli','orta_detay_osmanli_adam_karakter_v2.glb',[-.85,0,5.6]],['Kadın davetli','orta_detay_osmanli_kadin_karakter.glb',[.85,0,5.6]],['Mehteran','mehter_karakter_revize.glb',[-1.05,0,7]]];let loaded=0,failed=[];const people=[];let courtyard=null;
async function addModel([label,file,pos]){try{const gltf=await loader.loadAsync('./'+file);const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=pos?((label==='Kanuni'||label==='Hürrem')?0.73:0.57)/Math.max(size.y,.001):0.32;root.scale.setScalar(scale);root.position.set((pos?.[0]||0)-center.x*scale,pos?(pos[1]||0)-bounds.min.y*scale:0,(pos?.[2]||0)-center.z*scale);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});if(pos){root.userData.name=label;root.rotation.y=Math.PI;root.position.y=0;root.userData.standY=0;root.userData.standPosition=root.position.clone();people.push(root)}else {courtyard=root;root.traverse(o=>{if(o.name&&/Wedding_Floral_Arch/i.test(o.name))o.visible=false;if(o.isMesh&&/Wedding_(?:Walkway_Carpet|Carpet_Runner_Long)/i.test(o.name)){const mats=Array.isArray(o.material)?o.material:[o.material];o.material=mats.map(m=>{const c=m.clone();if(c.color)c.color.set('#a83d49');return c});if(o.material.length===1)o.material=o.material[0];}});}loaded++;}catch(e){failed.push(label);console.error(label,e)}status.classList.toggle('ready',loaded===6&&failed.length===0);status.innerHTML='<b>'+loaded+'/6 model yüklendi</b>'+ (failed.length?'<div>Eksik dosyalar: '+failed.join(', ')+'</div>':'<div>Yeni V3 düğün meydanı yüklendi.</div>')+(failed.length?'<div>GLB dosyalarını GitHub deposunun ana dizinine yükleyin.</div>':'');}
await Promise.all(models.map(addModel));

 // V3 meydanı kendi özgün geometrisiyle kullanılır; kodla uzatma yapılmaz.
 const meshes=[];courtyard.traverse(o=>{if(o.isMesh&&!/Sky|Cloud|Dome|Roof|Wall|Canopy/i.test(o.name))meshes.push(o)});const ray=new THREE.Raycaster();for(const p of people){ray.set(new THREE.Vector3(p.position.x,4,p.position.z),new THREE.Vector3(0,-1,0));const hits=ray.intersectObjects(meshes,false);const floor=hits.find(h=>h.point.y>=-.15&&h.point.y<=.6&&h.face&&h.face.normal.y>.45);if(floor)p.position.y=floor.point.y;}}

// TikTok LIVE bağlayıcısına hazır alay sistemi. Ses dosyaları ayrıca lisanslı olarak yüklenmelidir.
const $=id=>document.getElementById(id),MAX_GUESTS=90,roster=new Map();
const templates={male:people.find(p=>p.userData.name==='Erkek davetli'),female:people.find(p=>p.userData.name==='Kadın davetli'),mehter:people.find(p=>p.userData.name==='Mehteran')};
for(const p of people){if(['Erkek davetli','Kadın davetli','Mehteran'].includes(p.userData.name))p.visible=false;}
const royal=people.filter(p=>['Kanuni','Hürrem'].includes(p.userData.name));
const procession=[...royal],entryZ=8.3,stageZ=-3.35,walkSpeed=.055;
const roles=['male','female','mehter'],roleNames={male:'Erkek davetli',female:'Kadın davetli',mehter:'Mehteran'};
const royalOwners={hurrem:null,kanuni:null},royalExpiry={hurrem:0,kanuni:0};const normalRoles=new Map();const royalLabels={};let cameraMode='wide';const cameraModes=['wide','royal','bird','right','people','front'];
let phase='idle',startedAt=0,marchStart=0,walkDistance=0,previousFrame=performance.now(),trackIndex=0,seatStartedAt=0;const moving=new Map();let toastTimeout;
const audioPlayer=new Audio();audioPlayer.loop=true;audioPlayer.volume=.55;
const tracks=['ilk30saniye.mp3','yurume1.mp3','yurume2.mp3'];
let musicOn=false;
function showNote(msg){$('gameNote').textContent=msg}
function switchTrack(index){
 trackIndex=((index%tracks.length)+tracks.length)%tracks.length;$('track').value=String(trackIndex);
 const nextSrc=new URL('./'+tracks[trackIndex],location.href).href;
 if(audioPlayer.src!==nextSrc){audioPlayer.src=nextSrc;audioPlayer.load();}
 if(musicOn)audioPlayer.play().catch(()=>showNote('Müziği aç düğmesine basın'));
 showNote('Çalınan müzik: '+$('track').selectedOptions[0].text);
}
function makeNameLabel(name){
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext('2d');ctx.fillStyle='rgba(35,23,32,.83)';ctx.fillRect(4,12,504,96);
 ctx.font='bold 42px sans-serif';ctx.fillStyle='#ffe5a9';ctx.textAlign='center';
 ctx.fillText('@'+String(name).replace(/^@/,''),256,76,490);
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,depthTest:false,transparent:true}));
 sprite.scale.set(.72,.18,1);sprite.position.set(0,.67,0);return sprite;
}
function cloneRole(role,name){
 const base=role==='hurrem'?royal.find(p=>p.userData.name==='Hürrem'):role==='kanuni'?royal.find(p=>p.userData.name==='Kanuni'):templates[role];if(!base)return null;
 const obj=base.clone(true);obj.traverse(o=>{if(o.isMesh){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone()}});
 obj.visible=true;obj.userData.name=name;obj.userData.role=role;obj.rotation.y=0;const tag=document.createElement('div');tag.className='nameTag';tag.textContent='@'+name;document.getElementById('nameLayer').appendChild(tag);obj.userData.nameTag=tag;
 scene.add(obj);return obj;
}
function slot(index){const row=Math.floor(index/2),side=index%2===0?-1:1;return {x:side*(.48+(row%3)*.12),z:entryZ+row*.56}}
function repositionQueue(){
 const all=[...roster.values()].reverse();
 all.forEach((p,i)=>{const target=slot(i);p.userData.queueTarget=new THREE.Vector3(target.x,0,target.z-walkDistance);});
}
function toastJoin(username){
 const toast=document.getElementById('joinToast');toast.textContent='🎉 @'+username+' düğüne katıldı!';
 toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');
 clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.classList.remove('show'),3200);
}
function moveTo(p,target,duration=9){moving.set(p,{from:p.position.clone(),to:target.clone(),start:performance.now(),duration:duration*1000});}

function joinGuest(name,role='male'){
 const username=String(name||'').trim().replace(/^@/,'').slice(0,24);if(!username)return false;
 if(roster.has(username))return role===roster.get(username).userData.role?true:changeRole(username,role);
 if(roster.size>=MAX_GUESTS){showNote('90 kişilik alay doldu');return false}
 if(phase==='finished'){showNote('Tören tamamlandı; yeni alay için sayfayı yenileyin');return false}
 if(![...roles,'hurrem','kanuni'].includes(role))role='male';
 const index=roster.size,point=slot(index),obj=cloneRole(role,username);if(!obj)return false;

 roster.set(username,obj);procession.push(obj);if(roles.includes(role))normalRoles.set(username,role);repositionQueue();toastJoin(username);

function changeRole(username,role){
 const old=roster.get(username);if(!old||![...roles,'hurrem','kanuni'].includes(role))return false;
 if(old.userData.role===role)return true;
 const replacement=cloneRole(role,username);if(!replacement)return false;
 replacement.position.copy(old.position);replacement.rotation.copy(old.rotation);replacement.userData.slot=old.userData.slot;replacement.userData.queueTarget=old.userData.queueTarget;if(old.userData.nameTag)old.userData.nameTag.remove();

 roster.set(username,replacement);scene.remove(old);if(roles.includes(role))normalRoles.set(username,role);repositionQueue();toastJoin(username+' · '+({female:'Kadın davetli',male:'Erkek davetli',mehter:'Mehteran',hurrem:'Hürrem Sultan',kanuni:'Kanuni Sultan Süleyman'})[role]);showNote(username+' artık '+(roleNames[role]||role));return true;

function getRoyal(role){return royal.find(p=>p.userData.name===(role==='hurrem'?'Hürrem':'Kanuni'))}
function clearRoyal(role){const old=royalOwners[role];royalOwners[role]=null;royalExpiry[role]=0;if(royalLabels[role]){royalLabels[role].remove();delete royalLabels[role]}return old}
function removeGuest(name,notify=true){
 const username=String(name||'').trim().replace(/^@/,'');let removed=false;
 for(const role of ['hurrem','kanuni'])if(royalOwners[role]===username){clearRoyal(role);removed=true}
 const p=roster.get(username);
 if(p){p.userData.nameTag?.remove();moving.delete(p);scene.remove(p);roster.delete(username);normalRoles.delete(username);const i=procession.indexOf(p);if(i>=0)procession.splice(i,1);repositionQueue();$('count').textContent=roster.size+'/90 kişi';removed=true}
 if(removed){if(notify)showNote('@'+username+' alaydan çıkarıldı');reportToPanel({changed:true})}return removed;
}
function awardRoyal(name,role){
 const username=String(name||'').trim().replace(/^@/,'').slice(0,24);if(!username)return false;

 document.getElementById('nameLayer').appendChild(tag);royalLabels[role]=tag;royalOwners[role]=username;royalExpiry[role]=performance.now()+60000;

}
function receiveGift(name,gift='female'){

 if(roles.includes(action)){const username=String(name||'').trim().replace(/^@/,'');for(const role of ['hurrem','kanuni'])if(royalOwners[role]===username)clearRoyal(role);return joinGuest(username,action)}

}

function seatEveryone(){

 if(courtyard){courtyard.updateMatrixWorld(true);courtyard.traverse(o=>{
  if(!o.isMesh)return;
  const n=(o.name||'').toLowerCase();if(!/chair|seat|sandalye|throne|taht/.test(n))return;
  const b=new THREE.Box3().setFromObject(o);if(b.isEmpty())return;

 });}

 royal.forEach((p,i)=>{const target=throneSeats[i]||new THREE.Vector3((i===0?-.37:.37),0,-3.4);moveTo(p,new THREE.Vector3(target.x,0,target.z),18+i*2)});
 const guests=[...roster.values()].filter(p=>p.userData.role!=='mehter');

 guests.forEach((p,i)=>{
  // Sandalye bulunamazsa kullanıcıyı sandalyeye ışınlamak yerine alaydan yürüyerek ayrılan bir sıra oluştur.
  const c=seats[i]||new THREE.Vector3((i%2?1:-1)*(1.2+Math.floor(i/12)*.38),0,-2.3+Math.floor(i/2)%6*.45);

 });
 band.forEach((p,i)=>moveTo(p,new THREE.Vector3(-3.45+(i%5)*.30,0,-1.1+Math.floor(i/5)*.32),22+i*.35));

}

// Hediye isimleri geçicidir: gerçek TikTok kataloğundan ID'ler doğrulanınca güncellenir.
const giftRules={

 '10-hurrem':'hurrem','10-kanuni':'kanuni'
};
const giftRulesById={}; // Gerçek hediye ID'leri LIVE'da görüldüğünde eklenebilir.
const coinRoles={1:null,3:null,10:null}; // Aynı tutarda birden fazla hediye olduğunda isim/ID şarttır.
function applyGiftConfig(cfg){
 if(!cfg||typeof cfg!=='object')return;
 if(cfg.gifts&&typeof cfg.gifts==='object')for(const [name,role] of Object.entries(cfg.gifts)){
  if(['male','female','mehter','hurrem','kanuni'].includes(role))giftRules[name.toLocaleLowerCase('tr-TR')]=role;
 }
 if(cfg.ids&&typeof cfg.ids==='object')for(const [id,role] of Object.entries(cfg.ids)){
  if(['male','female','mehter','hurrem','kanuni'].includes(role))giftRulesById[id]=role;
 }
}
function liveGiftEvent(data){
 const name=String(data?.uniqueId||data?.user?.uniqueId||data?.username||'').replace(/^@/,'');
 const gift=String(data?.giftName||'').toLocaleLowerCase('tr-TR');
 const giftId=String(data?.giftId??'');
 const action=giftRulesById[giftId]||giftRules[gift];
 if(!name||!action)return false;
 return receiveGift(name,action);
}
window.weddingGiftRules=giftRules;
window.weddingApplyGiftConfig=applyGiftConfig;
window.weddingLive={join:joinGuest,gift:receiveGift,onGift:liveGiftEvent,changeRole,start:beginCountdown,beginMarch};
const panelChannel=new BroadcastChannel('hurrem-control-v1');
function handlePanelCommand(cmd){

 if(cmd.type==='start')beginCountdown();

 if(cmd.type==='music'){musicOn=true;switchTrack(Number(cmd.track)||0);audioPlayer.play().catch(()=>showNote('Yayın sesini açmak için oyun ekranında bir kez tıklayın'));}

 if(cmd.type==='cameraReset')cameraMode='wide';
}
const panelInstance='game-'+Math.random().toString(36).slice(2);
function reportToPanel(payload){panelChannel.postMessage({type:'game-status',instance:panelInstance,phase,guestCount:roster.size,guests:[...roster.values()].map(p=>({username:p.userData.name,role:p.userData.role})).concat(['hurrem','kanuni'].filter(r=>royalOwners[r]).map(r=>({username:royalOwners[r],role:r}))),cameraMode,...payload});}
panelChannel.onmessage=e=>{
 const cmd=e.data;
 if(cmd?.type==='ping'){reportToPanel({replyTo:cmd.id});return;}
 if(['join','remove','camera','start','march','music','stopMusic','cameraReset'].includes(cmd?.type)){
  handlePanelCommand(cmd);reportToPanel({replyTo:cmd.id||null,accepted:true});
 }
};
setInterval(()=>reportToPanel({heartbeat:true}),2000);
reportToPanel({ready:true});
window.addEventListener('wedding-live-gift',e=>liveGiftEvent(e.detail));
// Yerel TikTok köprüsü: aynı adresten sunulan oyun WebSocket'e bağlanır.
(function connectLive(){
 const local=['localhost','127.0.0.1'].includes(location.hostname);
 if(!local)return;
 let socket;
 function open(){
  socket=new WebSocket('ws://'+location.host+'/live');
  socket.onopen=()=>showNote('🟢 TikTok bağlantı köprüsü hazır');
  socket.onmessage=e=>{
   let data;try{data=JSON.parse(e.data)}catch{return}
   if(data.type==='config')applyGiftConfig(data.config);
   if(data.type==='command')handlePanelCommand(data.command);
   if(data.type==='gift')liveGiftEvent(data);
   if(data.type==='status')showNote(data.message||'TikTok durumu güncellendi');
  };
  socket.onclose=()=>{showNote('🟠 Bağlantı koptu; yeniden deneniyor');setTimeout(open,3000)};
  socket.onerror=()=>{};
 }
 open();
})();

$('join').onclick=()=>{if(joinGuest($('guestName').value,roles[roster.size%3]))$('guestName').value=''};
$('guestName').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});
$('start').textContent='30 sn başlat';$('start').onclick=beginCountdown;$('publicStart').onclick=beginCountdown;
$('gift').onclick=()=>{const name=$('guestName').value.trim();if(name){const role=roster.has(name)?roles[(roles.indexOf(roster.get(name).userData.role)+1)%3]:roles[roster.size%3];receiveGift(name,role)}else showNote('Test için önce kullanıcı adı girin')};
$('track').onchange=e=>switchTrack(Number(e.target.value));
$('music').onclick=async()=>{musicOn=!musicOn;if(musicOn){if(!audioPlayer.getAttribute('src'))switchTrack(trackIndex);try{await audioPlayer.play()}catch(e){showNote('Ses için tarayıcı izni veya dosya erişimi gerekli');musicOn=false}}else audioPlayer.pause();$('music').textContent=musicOn?'❚❚ Müziği durdur':'▶ Müzik aç'};
$('gameNote').textContent='30 saniye katılım · Yürürken de katılabilirsiniz · Gerçek MP3 bekleniyor';
royal.forEach((p,i)=>{p.visible=true;p.position.set(i===0?-.24:.24,0,entryZ-1);p.rotation.y=Math.PI});
audioPlayer.src='./'+tracks[0];$('phase').textContent='Başlatılmayı bekliyor';$('timer').textContent='00:30';const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const now=performance.now(),dt=Math.min(.05,(now-previousFrame)/1000);previousFrame=now;
 const t=clock.getElapsedTime();
 if(phase==='countdown'){
  const remaining=Math.max(0,30-Math.floor((now-startedAt)/1000));
  $('timer').textContent='00:'+String(remaining).padStart(2,'0');$('publicTimer').textContent='00:'+String(remaining).padStart(2,'0');
  $('progress').style.width=(remaining/30*100)+'%';
  if(!remaining)beginMarch();
 }
 if(phase==='march'){
  const delta=walkSpeed*dt;walkDistance+=delta;
  for(const p of royal){p.position.z-=delta;p.rotation.y=Math.PI;p.position.y=Math.sin(t*3+p.position.z)*.003}for(const p of roster.values()){if(p.userData.queueTarget)p.userData.queueTarget.z-=delta;}
  if(royal[0]&&royal[0].position.z<=stageZ)seatEveryone();
 }
 for(const role of ['hurrem','kanuni'])if(royalOwners[role]&&now>=royalExpiry[role]){const username=clearRoyal(role);showNote('@'+username+' için 60 saniyelik saltanat sona erdi');reportToPanel({changed:true});}
 for(const p of roster.values()){
  if((phase==='march'||phase==='countdown')&&p.userData.queueTarget&&!moving.has(p)){
   const d=p.userData.queueTarget.clone().sub(p.position);const step=Math.min(1,dt*.42);
   p.position.addScaledVector(d,step);
  }
 }
 for(const [p,m] of moving){const a=Math.min(1,(now-m.start)/m.duration);const eased=a*a*(3-2*a);p.position.lerpVectors(m.from,m.to,eased);if(a>=1){moving.delete(p);p.userData.seated=true;p.scale.y*=.77;}}
 if(phase==='seating'&&moving.size===0){phase='finished';$('phase').textContent='Düğün merasimi';$('timer').textContent='TÖREN';switchTrack(2);}
 const center=royal[0]&&royal[1]?royal[0].position.clone().add(royal[1].position).multiplyScalar(.5):new THREE.Vector3();
 const guests=[...roster.values()],peopleCenter=guests.length?guests.reduce((v,p)=>v.add(p.position),new THREE.Vector3()).multiplyScalar(1/guests.length):center.clone().add(new THREE.Vector3(0,0,2.5));
 const focus=new THREE.Vector3(),offset=new THREE.Vector3();
 if(cameraMode==='royal'){focus.copy(center).add(new THREE.Vector3(0,.45,0));offset.set(0,1.55,2.9)}
 else if(cameraMode==='bird'){focus.copy(center).lerp(peopleCenter,.5);offset.set(0,13.5,2)}
 else if(cameraMode==='right'){focus.copy(center).add(new THREE.Vector3(0,.4,0));offset.set(3.4,2.1,3.4)}
 else if(cameraMode==='people'){focus.copy(peopleCenter).add(new THREE.Vector3(0,.35,0));offset.set(0,2.5,4.2)}
 else if(cameraMode==='front'){focus.copy(center).add(new THREE.Vector3(0,.45,0));offset.set(-2.6,1.7,2.4)}
 else{focus.copy(center).lerp(peopleCenter,.28);offset.set(0,4.5,10.5)}
 camera.position.lerp(focus.clone().add(offset),Math.min(1,dt*2.2));controls.target.lerp(focus,Math.min(1,dt*2.2));controls.update();renderer.render(scene,camera);
 const screenW=host.clientWidth,screenH=host.clientHeight;
 for(const p of roster.values()){const tag=p.userData.nameTag;if(!tag)continue;
  const v=new THREE.Vector3(0,.94,0);p.localToWorld(v);v.project(camera);
  const visible=v.z>-1&&v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
  tag.style.display=visible?'block':'none';
  if(visible){tag.style.left=((v.x+1)*.5*screenW)+'px';tag.style.top=((1-v.y)*.5*screenH)+'px';}
 }
 for(const role of ['hurrem','kanuni']){const tag=royalLabels[role],p=getRoyal(role);if(!tag||!p)continue;const v=new THREE.Vector3(0,1.12,0);p.localToWorld(v);v.project(camera);const visible=v.z>-1&&v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;tag.style.display=visible?'block':'none';if(visible){tag.style.left=((v.x+1)*.5*screenW)+'px';tag.style.top=((1-v.y)*.5*screenH)+'px';}}
}
animate();addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
